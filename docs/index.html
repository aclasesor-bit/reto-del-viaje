<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>El Súper Reto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#fbf7f2">
<meta name="description" content="Juego de comportamiento para Valeria, Alejandra y Paula.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Súper Reto">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg1:#fdf7f1; --bg2:#eef4fb;
  --tinta:#2c3244; --suave:#6b7385; --linea:#e9e3dc;
  --verde:#2e9c6b; --verde-osc:#237a53; --verde-luz:#e6f6ee;
  --rojo:#e0574f; --rojo-osc:#b9433c; --rojo-luz:#fdeceb;
  --r:22px;
  --sombra:0 6px 18px rgba(44,50,68,.08), 0 1px 3px rgba(44,50,68,.06);
}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  color:var(--tinta);
  background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  padding:0 0 env(safe-area-inset-bottom);
}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
.envoltura{max-width:640px;margin:0 auto;padding:0 14px 40px}

/* ---------- cabecera ---------- */
.top{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  background:rgba(253,247,241,.92);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--linea);
}
.top h1{
  flex:1;min-width:0;margin:0;font-size:1.2rem;line-height:1.15;font-weight:800;letter-spacing:-.02em;
}
.top h1 small{display:block;font-size:.72rem;font-weight:600;color:var(--suave);margin-top:2px}
.icono{
  width:46px;height:46px;flex:0 0 46px;border-radius:14px;border:1px solid var(--linea);
  background:#fff;font-size:1.2rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(44,50,68,.06);
}
.icono:active{transform:scale(.94)}

/* ---------- tarjeta ---------- */
.tarjeta{
  background:#fff;border-radius:var(--r);box-shadow:var(--sombra);
  padding:14px 15px 15px;margin-top:12px;border:1px solid rgba(233,227,220,.9);
  position:relative;overflow:hidden;
}
.tarjeta::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--acento)}
.tarjeta.castigada{background:#fff6f5;border-color:#f6cfcc}
.tarjeta.premiada{background:#f6fdf9;border-color:#c9ecd9}
.nombre{
  display:flex;align-items:center;gap:9px;margin:4px 0 10px;
  font-size:1.3rem;font-weight:800;letter-spacing:-.02em;
}
.inicial{
  width:42px;height:42px;flex:0 0 42px;border-radius:50%;
  background:var(--acento);color:#fff;font-size:1.05rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-size:cover;background-position:center top;
}
.inicial.confoto{box-shadow:0 0 0 2.5px var(--acento), 0 0 0 4px #fff;color:transparent}
.marcador{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
.fila{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:36px}
.pip{font-size:1.72rem;line-height:1.05;display:inline-block}
.pip.vacio{filter:grayscale(1);opacity:.24}
.cuenta{
  margin-left:auto;font-size:.85rem;font-weight:700;color:var(--suave);
  background:#f5f2ee;border-radius:999px;padding:4px 11px;white-space:nowrap;
}
@keyframes romper{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.45) rotate(-14deg)}60%{transform:scale(.7) rotate(12deg);opacity:.5}100%{transform:scale(1) rotate(0)}}
@keyframes brotar{0%{transform:scale(.2) rotate(-40deg);opacity:0}55%{transform:scale(1.45) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.pip.rompe{animation:romper .55s ease}
.pip.brota{animation:brotar .55s cubic-bezier(.22,1.2,.4,1)}
@keyframes temblar{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(6px)}45%{transform:translateX(-5px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.tarjeta.tiembla{animation:temblar .5s ease}
@keyframes saltar{0%,100%{transform:translateY(0)}35%{transform:translateY(-7px)}70%{transform:translateY(0)}}
.tarjeta.salta{animation:saltar .45s ease}

/* ---------- fogonazo: la super animacion, a pantalla completa ---------- */
/* se apaga la luz un momento: sobre fondo claro los fuegos no se verian */
#noche{
  position:fixed;inset:0;z-index:87;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 32%, rgba(26,22,58,.62) 0%, rgba(8,6,24,.88) 100%);
  animation:anochecer 2.45s ease-out forwards;
}
#noche[hidden]{display:none}
#noche.tormenta{background:radial-gradient(circle at 50% 28%, rgba(32,40,74,.55) 0%, rgba(5,9,26,.9) 100%)}
@keyframes anochecer{0%{opacity:0}11%{opacity:1}74%{opacity:.92}100%{opacity:0}}
#fuegos{position:fixed;inset:0;z-index:88;pointer-events:none}
#fuegos[hidden]{display:none}
#fogonazo{
  position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden;perspective:1000px;
  --cx:50%;--cy:42%;--tinte:rgba(247,201,72,.55);--vivo:#f7c948;--letra:#c98a06;
}
#fogonazo[hidden]{display:none}

/* los relampagos de la tormenta */
#fogonazo .rayo{
  position:absolute;inset:0;background:#e2ecff;opacity:0;
  animation:relampaguea 1.9s linear forwards;
}
@keyframes relampaguea{
  0%,3%{opacity:0}
  4%{opacity:.92} 6%{opacity:.08} 8%{opacity:.7} 11%{opacity:0}
  31%{opacity:0} 33%{opacity:.55} 35%{opacity:.04} 37%{opacity:.4} 40%{opacity:0}
  57%{opacity:0} 59%{opacity:.7} 61%{opacity:.06} 64%{opacity:.35} 68%{opacity:0}
  100%{opacity:0}
}
/* el fogonazo de luz del primer instante */
#fogonazo .relampago{
  position:absolute;inset:0;background:#fff;opacity:0;
  animation:relampaguear .5s ease-out forwards;
}
@keyframes relampaguear{0%{opacity:0}8%{opacity:.85}100%{opacity:0}}

/* el sol de rayos que barre toda la pantalla (solo en la buena) */
#fogonazo .rayos{
  position:absolute;left:var(--cx);top:var(--cy);width:280vmax;height:280vmax;
  margin:-140vmax 0 0 -140vmax;opacity:0;
  background:repeating-conic-gradient(from 0deg, var(--vivo) 0deg 7deg, transparent 7deg 23deg);
  -webkit-mask-image:radial-gradient(circle, #000 0%, #000 22%, transparent 58%);
          mask-image:radial-gradient(circle, #000 0%, #000 22%, transparent 58%);
  animation:radiar 1.05s cubic-bezier(.1,.72,.3,1) forwards;
}
@keyframes radiar{
  0%{transform:rotate(0) scale(.04);opacity:0}
  14%{opacity:.6}
  55%{opacity:.3}
  100%{transform:rotate(34deg) scale(1);opacity:0}
}
/* la oscuridad que se cierra desde los bordes (solo en la mala) */
#fogonazo .vineta{
  position:absolute;inset:0;opacity:0;
  background:radial-gradient(circle at var(--cx) var(--cy), transparent 0%, transparent 22%, rgba(120,26,22,.62) 100%);
  animation:cerrarse 1.9s ease-out forwards;
}
@keyframes cerrarse{0%{opacity:0;transform:scale(1.6)}22%{opacity:1;transform:scale(1)}70%{opacity:.85}100%{opacity:0}}

#fogonazo .destello{
  position:absolute;inset:0;
  background:radial-gradient(circle at var(--cx) var(--cy), var(--tinte) 0%, transparent 68%);
  animation:destellar .75s ease-out forwards;
}
#fogonazo .onda{
  position:absolute;left:var(--cx);top:var(--cy);width:26px;height:26px;margin:-13px 0 0 -13px;
  border-radius:50%;border:7px solid var(--vivo);
  animation:ondear 1.25s cubic-bezier(.12,.72,.28,1) forwards;
}
#fogonazo .onda.dos{animation-delay:.16s;opacity:0}
#fogonazo .onda.tres{animation-delay:.33s;opacity:0}

#fogonazo .astro{
  position:absolute;left:var(--cx);top:var(--cy);
  font-size:min(64vw, 48vh);line-height:1;
  filter:drop-shadow(0 16px 34px rgba(30,26,20,.4));
}
/* el +1 que sale volando de la estrella */
#fogonazo .masuno{
  position:absolute;left:var(--cx);top:var(--cy);
  font-size:clamp(1.8rem, 9vw, 3.4rem);font-weight:900;color:#fff;
  -webkit-text-stroke:2.5px var(--letra);paint-order:stroke fill;
  text-shadow:0 4px 14px rgba(30,26,20,.35);white-space:nowrap;opacity:0;
  animation:volar 1.5s cubic-bezier(.2,.9,.3,1) .28s forwards;
}
@keyframes volar{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  18%{opacity:1;transform:translate(-50%,-90%) scale(1.25)}
  60%{opacity:1;transform:translate(-50%,-190%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-300%) scale(.9)}
}
#fogonazo .cartel{
  position:absolute;left:50%;top:11%;transform:translate(-50%,0);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  white-space:nowrap;opacity:0;
  animation:cartelear 2.2s cubic-bezier(.2,1.1,.35,1) forwards;
}
#fogonazo .cartel b{
  font-size:clamp(2rem, 12.5vw, 5rem);font-weight:900;letter-spacing:.02em;
  color:#fff;-webkit-text-stroke:3px var(--letra);paint-order:stroke fill;
  text-shadow:0 6px 0 rgba(0,0,0,.12), 0 14px 30px rgba(30,26,20,.3);
}
#fogonazo .cartel i{
  font-style:normal;font-size:clamp(1.1rem, 6.2vw, 2.3rem);font-weight:900;letter-spacing:.08em;
  color:#fff;-webkit-text-stroke:2px var(--letra);paint-order:stroke fill;
}
@keyframes cartelear{
  0%{opacity:0;transform:translate(-50%,26px) scale(.4) rotate(-7deg)}
  12%{opacity:1;transform:translate(-50%,0) scale(1.18) rotate(3deg)}
  21%{transform:translate(-50%,0) scale(.97) rotate(-2deg)}
  30%{transform:translate(-50%,0) scale(1.06) rotate(0)}
  42%,80%{opacity:1;transform:translate(-50%,0) scale(1) rotate(0)}
  100%{opacity:0;transform:translate(-50%,-30px) scale(1.1) rotate(0)}
}
#fogonazo .chispa,
#fogonazo .gota{position:absolute;line-height:1;opacity:0}
#fogonazo .chispa{
  left:var(--cx);top:var(--cy);
  animation:chispear var(--t) cubic-bezier(.08,.72,.28,1) var(--r) forwards;
}
#fogonazo .gota{
  left:var(--l);top:-14vh;
  animation:llover var(--t) linear var(--r) forwards;
}
@keyframes destellar{0%{opacity:0}12%{opacity:1}62%{opacity:.5}100%{opacity:0}}
@keyframes ondear{0%{transform:scale(.12);opacity:.95;border-width:9px}100%{transform:scale(28);opacity:0;border-width:1px}}
@keyframes chispear{
  0%{transform:translate(-50%,-50%) scale(.15) rotate(0);opacity:0}
  10%{opacity:1}
  100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(var(--e)) rotate(var(--g));opacity:0}
}
@keyframes llover{
  0%{transform:translateY(0) rotate(0);opacity:0}
  8%{opacity:1}
  85%{opacity:1}
  100%{transform:translateY(128vh) rotate(var(--g));opacity:0}
}
/* la estrella gira en el aire, no solo se hace grande */
@keyframes estallar{
  0%{transform:translate(-50%,-50%) scale(.05) rotateY(-560deg) rotateZ(-45deg);opacity:0}
  16%{transform:translate(-50%,-50%) scale(1.3) rotateY(-40deg) rotateZ(16deg);opacity:1}
  28%{transform:translate(-50%,-50%) scale(.86) rotateY(30deg) rotateZ(-10deg)}
  40%{transform:translate(-50%,-53%) scale(1.1) rotateY(-14deg) rotateZ(6deg)}
  52%{transform:translate(-50%,-50%) scale(.96) rotateY(8deg) rotateZ(-3deg)}
  64%{transform:translate(-50%,-52%) scale(1.04) rotateY(0deg) rotateZ(2deg)}
  76%{transform:translate(-50%,-50%) scale(1) rotateY(0) rotateZ(0);opacity:1}
  100%{transform:translate(-50%,-64%) scale(3) rotateY(0) rotateZ(0);opacity:0}
}
#fogonazo .astro.gana{animation:estallar 1.7s cubic-bezier(.2,1,.35,1) forwards}
@keyframes desplomar{
  0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0}
  12%{transform:translate(-50%,-50%) scale(1.14) rotate(0);opacity:1}
  20%{transform:translate(-57%,-50%) scale(1.04) rotate(-13deg)}
  28%{transform:translate(-43%,-50%) scale(1.04) rotate(13deg)}
  36%{transform:translate(-55%,-50%) scale(1) rotate(-8deg)}
  44%{transform:translate(-45%,-50%) scale(1) rotate(8deg)}
  52%{transform:translate(-51%,-50%) scale(.98) rotate(-4deg)}
  62%{transform:translate(-50%,-48%) scale(.96) rotate(0);opacity:1}
  100%{transform:translate(-50%,64%) scale(.7) rotate(24deg);opacity:0}
}
#fogonazo .astro.pierde{animation:desplomar 2.1s cubic-bezier(.4,.02,.65,1) forwards}

/* la propia pagina reacciona: un botecito al ganar, un temblor al perder */
@keyframes celebrar{0%,100%{transform:scale(1)}18%{transform:scale(1.05)}42%{transform:scale(.988)}68%{transform:scale(1.014)}}
@keyframes sacudir{
  0%,100%{transform:translate3d(0,0,0)}
  8%{transform:translate3d(-11px,4px,0)}
  18%{transform:translate3d(10px,-5px,0)}
  28%{transform:translate3d(-9px,-3px,0)}
  38%{transform:translate3d(8px,5px,0)}
  50%{transform:translate3d(-6px,-4px,0)}
  62%{transform:translate3d(5px,3px,0)}
  76%{transform:translate3d(-3px,2px,0)}
  90%{transform:translate3d(2px,-1px,0)}
}
body.celebra .envoltura{animation:celebrar .85s cubic-bezier(.2,1.1,.35,1)}
body.sacude .envoltura{animation:sacudir .8s ease-out}

/* ---------- avisos ---------- */
@keyframes entrar{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.aviso{
  display:flex;align-items:center;gap:9px;border-radius:16px;padding:10px 12px;margin-bottom:10px;
  font-weight:800;font-size:1rem;line-height:1.25;animation:entrar .3s ease;
}
.aviso .emo{font-size:1.6rem;line-height:1}
.aviso.mal{background:var(--rojo-luz);color:var(--rojo-osc);border:1px solid #f6cfcc}
.aviso.bien{background:var(--verde-luz);color:var(--verde-osc);border:1px solid #c9ecd9}
@keyframes penar{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) translateY(2px)}75%{transform:rotate(7deg) translateY(2px)}}
.aviso.mal .emo{animation:penar 1.9s ease-in-out infinite}
@keyframes latir{0%,100%{transform:scale(1)}40%{transform:scale(1.22)}}
.aviso.bien .emo{animation:latir 1.3s ease-in-out infinite}

/* ---------- botones ---------- */
.acciones{display:flex;flex-direction:column;gap:8px}
.grande{
  width:100%;min-height:60px;border:0;border-radius:18px;
  font-size:1.05rem;font-weight:800;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:10px 12px;text-align:center;line-height:1.15;
  box-shadow:0 4px 0 var(--sombra-btn), 0 6px 14px rgba(44,50,68,.13);
  transition:transform .07s ease, box-shadow .07s ease;
}
.grande .em{font-size:1.3rem}
.grande:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sombra-btn),0 3px 8px rgba(44,50,68,.13)}
.grande[disabled]{opacity:.42;box-shadow:none;transform:none;cursor:default}
.bien{background:var(--verde);--sombra-btn:var(--verde-osc)}
.mal{background:var(--rojo);--sombra-btn:var(--rojo-osc)}
.deshacer{
  width:100%;min-height:48px;border-radius:15px;border:1.5px solid var(--linea);
  background:#faf8f6;color:var(--suave);font-size:.98rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.deshacer:active{background:#f0ece7}
.deshacer[disabled]{opacity:.4;cursor:default}

/* ---------- ranking ---------- */
.ranking{padding:13px 14px 4px}
.ranking-cab{display:flex;align-items:center;gap:8px}
.ranking h2{
  flex:1;min-width:0;margin:0;font-size:1rem;font-weight:800;letter-spacing:-.01em;
}
.sync{
  flex:0 0 auto;min-height:36px;border-radius:999px;border:1.5px solid var(--linea);
  background:#faf8f6;font-size:.76rem;font-weight:700;color:var(--suave);
  padding:6px 11px;white-space:nowrap;font-family:inherit;
}
.sync.mal{border-color:#f6cfcc;background:var(--rojo-luz);color:var(--rojo-osc)}
.sync.bien{border-color:#c9ecd9;background:var(--verde-luz);color:var(--verde-osc)}
.pestanas{display:flex;gap:6px;margin:10px 0 2px;background:#f5f2ee;border-radius:14px;padding:4px}
.pest{
  flex:1;min-height:44px;border:0;border-radius:11px;background:none;
  font-size:.95rem;font-weight:800;color:var(--suave);font-family:inherit;
}
.pest.activa{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(44,50,68,.12)}
.pista{margin:8px 2px 2px;font-size:.74rem;font-weight:600;color:var(--suave);line-height:1.35}
.rank{
  display:flex;width:100%;align-items:center;gap:10px;min-height:52px;
  padding:9px 2px;border:0;border-top:1px solid #f2eee9;background:none;
  font-family:inherit;color:inherit;text-align:left;
}
.rank:active{background:#faf7f4}
.puesto{flex:0 0 30px;font-size:1.3rem;line-height:1;text-align:center}
.puesto.igualados{font-size:1rem;color:var(--suave);font-weight:800}
.rank .quien{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:800}
.rank .punto{width:10px;height:10px;flex:0 0 10px;border-radius:50%;background:var(--acento)}
.rank .carita{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;background-size:cover;background-position:center top;
  box-shadow:0 0 0 2px var(--acento);
}
.rank .marca{display:flex;align-items:center;gap:7px;font-size:1rem;font-weight:800;white-space:nowrap}
.rank .marca span{display:inline-flex;align-items:center;gap:3px}
.rank .neto{
  justify-content:center;min-width:34px;padding:2px 7px;border-radius:999px;
  font-size:.92rem;font-weight:900;background:#f0ece7;color:var(--suave);
}
.rank .neto.bien{background:var(--verde-luz);color:var(--verde-osc)}
/* en pantallas estrechas los numeros se aprietan para que quepa el nombre entero */
@media (max-width:360px){
  .rank .marca{gap:5px;font-size:.92rem}
  .rank .neto{min-width:29px;padding:2px 6px;font-size:.85rem}
}
.rank .neto.mal{background:var(--rojo-luz);color:var(--rojo-osc)}
.rank .sello{font-size:1.1rem}
.rank.malva .marca{color:var(--rojo-osc)}
.rank.buena .marca{color:var(--verde-osc)}

/* ---------- ranking semanal ---------- */
.semanera{border-top:1px solid #f2eee9;padding:10px 2px 12px}
.semanera:first-child{border-top:0}
.semanera .rank{border-top:0;padding:0;min-height:44px}
.dias{display:flex;gap:5px;margin-top:8px}
.dia{
  flex:1;min-width:0;border-radius:12px;background:#f6f3f0;padding:6px 1px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.dia b{font-size:.68rem;font-weight:800;color:var(--suave)}
.dia i{font-style:normal;font-size:.95rem;font-weight:800;line-height:1.2}
.dia u{
  text-decoration:none;font-size:.72rem;font-weight:900;line-height:1.25;
  padding:0 5px;border-radius:999px;background:#ebe6e0;color:var(--suave);
}
.dia u.mas{background:#d3efe1;color:var(--verde-osc)}
.dia u.menos{background:#fbd7d4;color:var(--rojo-osc)}
.dia u.hueco{background:none}
.dia.premio{background:var(--verde-luz);color:var(--verde-osc)}
.dia.castigo{background:var(--rojo-luz);color:var(--rojo-osc)}
.dia.hoy{box-shadow:inset 0 0 0 2px var(--acento)}
.dia.futuro{opacity:.4}
.fotofila{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #f2eee9}
.fotofila:first-of-type{border-top:0}
.fotofila .inicial{width:52px;height:52px;flex:0 0 52px;font-size:1.15rem}
.fotofila .quien{flex:1;min-width:0;font-weight:800;font-size:1.02rem}
.fotofila label{
  min-height:46px;border-radius:14px;border:1.5px solid var(--linea);background:#faf8f6;
  display:flex;align-items:center;justify-content:center;padding:0 14px;

<script>
(function(){
"use strict";

var API = "https://miplandeempresa.com/reto-api";
var CLAVE = "reto-del-viaje-v2";
var CLAVE_VIEJA = "reto-del-viaje-v1";
var NINAS = [
  { id:"valeria",   nombre:"Valeria",   acento:"#e46a8b" },
  { id:"alejandra", nombre:"Alejandra", acento:"#7b6cd9" },
  { id:"paula",     nombre:"Paula",     acento:"#2aa8a8" }
];
var POR_DEFECTO = {
  oportunidades: 5,
  objetivo: 5,
  textoRecompensa: "¡Premio especial!",
  textoCastigo: "Castigada",
  ts: 0
};
var LETRAS = ["L","M","X","J","V"];

/* local = lo que guarda este movil:
     familia  codigo compartido con el otro movil
     doc      copia de lo que hay en el servidor (eventos por dia)
     cola     lo apuntado aqui que aun no ha llegado al servidor          */
var local = null;
var sincronizando = false, otraVuelta = false, red = "local", temporizador = null;

/* ---------------- utilidades ---------------- */
function dosCifras(n){ return String(n).padStart(2,"0"); }
function claveFecha(d){ return d.getFullYear() + "-" + dosCifras(d.getMonth()+1) + "-" + dosCifras(d.getDate()); }
function hoy(){ return claveFecha(new Date()); }
function ahora(){ var d = new Date(); return dosCifras(d.getHours()) + ":" + dosCifras(d.getMinutes()); }
function limitar(v, min, max, porDefecto){
  if (typeof v !== "number" || isNaN(v)) v = (porDefecto === undefined ? min : porDefecto);
  return Math.max(min, Math.min(max, v));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nuevoCodigo(){
  var a = "abcdefghijkmnpqrstuvwxyz23456789", s = "";
  for (var i=0;i<8;i++) s += a.charAt(Math.floor(Math.random()*a.length));
  return "casa-" + s;
}
function esc(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
/* lunes de la semana en la que cae d */
function lunesDe(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function semanaLaboral(){
  var l = lunesDe(new Date()), dias = [];
  for (var i=0;i<5;i++){ var x = new Date(l.getFullYear(), l.getMonth(), l.getDate()+i); dias.push(claveFecha(x)); }
  return dias;
}

/* ---------------- estado ---------------- */
function docVacio(){ return { v:1, config:null, fotos:{}, premios:{}, dias:{}, ts:0 }; }
function localVacio(){
  return { familia:null, sonido:true, vista:"hoy", doc:docVacio(), cola:{ nuevos:[], borrados:[], config:null, fotos:null, premios:null } };
}
function cfg(){
  var c = local.doc.config || {};
  return {
    oportunidades: limitar(parseInt(c.oportunidades,10), 1, 10, POR_DEFECTO.oportunidades),
    objetivo:      limitar(parseInt(c.objetivo,10),      1, 10, POR_DEFECTO.objetivo),
    textoRecompensa: c.textoRecompensa || POR_DEFECTO.textoRecompensa,
    textoCastigo:    c.textoCastigo    || POR_DEFECTO.textoCastigo,
    ts: Number(c.ts) || 0
  };
}
var RE_FOTO = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
function fotoDe(ninaId){
  var f = (local.doc.fotos || {})[ninaId];
  var img = f && typeof f.img === "string" ? f.img : "";
  return RE_FOTO.test(img) ? img : "";
}
function avatar(n, clase){
  var img = fotoDe(n.id);
  return '<span class="' + (clase || "inicial") + (img ? " confoto" : "") + '"' +
         (img ? ' style="background-image:url(' + img + ')"' : '') + '>' + n.nombre.charAt(0) + '</span>';
}
function guardarFoto(ninaId, img){
  local.doc.fotos = local.doc.fotos || {};
  var reg = { img: img || "", ts: Date.now() };
  local.doc.fotos[ninaId] = reg;
  local.cola.fotos = local.cola.fotos || {};
  local.cola.fotos[ninaId] = reg;
  red = "pendiente";
  guardar(); pintar(); pedirSync(0);
}
/* recorta al centro y deja una miniatura cuadrada pequena, que viaja por la red */
function miniatura(fichero, hecho){
  var lector = new FileReader();
  lector.onload = function(){
    var im = new Image();
    im.onload = function(){
      var lado = Math.min(im.width, im.height), L = 224;
      var c = document.createElement("canvas");
      c.width = L; c.height = L;
      var g = c.getContext("2d");
      g.drawImage(im, (im.width - lado) / 2, (im.height - lado) / 2 * 0.55, lado, lado, 0, 0, L, L);
      hecho(c.toDataURL("image/jpeg", 0.82));
    };
    im.onerror = function(){ hecho(null); };
    im.src = lector.result;
  };
  lector.onerror = function(){ hecho(null); };
  lector.readAsDataURL(fichero);
}
function clavePremio(nina, d){ return nina + "|" + d; }
function estadoPremio(nina, d){
  var p = (local.doc.premios || {})[clavePremio(nina, d)];
  return (p && p.estado) || "";
}
function ponerPremio(nina, d, estado){
  var reg = { estado: estado, ts: Date.now() };
  local.doc.premios = local.doc.premios || {};
  local.doc.premios[clavePremio(nina, d)] = reg;
  local.cola.premios = local.cola.premios || {};
  local.cola.premios[clavePremio(nina, d)] = reg;
  red = "pendiente";
}
/* el premio de hoy se apunta solo en cuanto llega al objetivo, y se cae si se deshace;
   los de dias anteriores no se tocan: ya estan ganados */
function reconciliarPremios(){
  var c = cfg(), d = hoy(), cambio = false;
  NINAS.forEach(function(n){
    var m = marcador(d, n.id, c), e = estadoPremio(n.id, d);
    if (m.premiada && e !== "ganado" && e !== "entregado"){ ponerPremio(n.id, d, "ganado"); cambio = true; }
    else if (!m.premiada && e === "ganado" && tieneEventos(d, n.id)){
      /* se cae solo si ha sido un deshacer; si se ha vaciado el dia entero, el premio se queda */
      ponerPremio(n.id, d, "anulado"); cambio = true;
    }
  });
  if (cambio){ guardar(); pedirSync(); }
  return cambio;
}
function tieneEventos(d, nina){
  return eventosDe(d).some(function(e){ return e.nina === nina; });
}
function premiosDe(nina, estado){
  var p = local.doc.premios || {}, salida = [];
  Object.keys(p).forEach(function(k){
    var trozos = k.split("|");
    if (trozos[0] !== nina) return;
    if (p[k].estado !== estado) return;
    salida.push({ clave:k, dia:trozos[1] });
  });
  return salida.sort(function(a,b){ return a.dia < b.dia ? 1 : -1; });
}
/* dias seguidos, de los que se ha jugado, sin quedarse sin corazones */
function racha(nina){
  var c = cfg(), d = hoy();
  var dias = Object.keys(local.doc.dias).filter(function(f){ return f <= d && eventosDe(f).length > 0; }).sort();
  var n = 0;
  for (var i = dias.length - 1; i >= 0; i--){
    if (marcador(dias[i], nina, c).castigada) break;
    n++;
  }
  return n;
}
function dia(d, crear){
  var x = local.doc.dias[d];
  if (!x && crear) x = local.doc.dias[d] = { eventos:[], borrados:[] };
  return x || { eventos:[], borrados:[] };
}
function eventosDe(d){ return dia(d).eventos; }
/* corazones y estrellas de una nina en un dia, calculados desde los eventos */
function marcador(d, ninaId, c){
  c = c || cfg();
  var bien = 0, mal = 0;
  eventosDe(d).forEach(function(e){
    if (e.nina !== ninaId) return;
    if (e.tipo === "bien") bien++; else mal++;
  });
  return {
    estrellas: bien,
    perdidos: mal,
    corazones: Math.max(0, c.oportunidades - mal),
    castigada: c.oportunidades - mal <= 0,
    premiada: bien >= c.objetivo
  };
}
function migrarDeLaVersionVieja(){
  var v = null;
  try { v = JSON.parse(localStorage.getItem(CLAVE_VIEJA) || "null"); } catch(e){ return null; }
  if (!v || typeof v !== "object") return null;
  var g = localVacio();
  var fecha = /^\d{4}-\d{2}-\d{2}$/.test(v.fecha || "") ? v.fecha : hoy();
  g.sonido = v.sonido !== false;
  var c = v.config || {};
  g.doc.config = {
    oportunidades: limitar(parseInt(c.oportunidades,10),1,10,POR_DEFECTO.oportunidades),
    objetivo:      limitar(parseInt(c.objetivo,10),1,10,POR_DEFECTO.objetivo),
    textoRecompensa: c.textoRecompensa || POR_DEFECTO.textoRecompensa,
    textoCastigo:    c.textoCastigo || POR_DEFECTO.textoCastigo,
    ts: Date.now()
  };
  g.cola.config = g.doc.config;
  var base = Date.now() - 1000;
  (Array.isArray(v.historial) ? v.historial : []).forEach(function(h,i){
    if (!h || (h.tipo !== "bien" && h.tipo !== "mal")) return;
    var ev = { id:uid(), dia:fecha, nina:h.nina, tipo:h.tipo, hora:h.hora || ahora(), ts: base + i };
    g.doc.dias[fecha] = g.doc.dias[fecha] || { eventos:[], borrados:[] };
    g.doc.dias[fecha].eventos.push({ id:ev.id, nina:ev.nina, tipo:ev.tipo, hora:ev.hora, ts:ev.ts });
    g.cola.nuevos.push(ev);
  });
  return g;
}
function cargar(){
  var g = null;
  try { g = JSON.parse(localStorage.getItem(CLAVE) || "null"); } catch(e){ g = null; }
  if (!g || typeof g !== "object") g = migrarDeLaVersionVieja();
  if (!g || typeof g !== "object") g = localVacio();
  var base = localVacio();
  g.doc = (g.doc && typeof g.doc === "object" && g.doc.dias) ? g.doc : base.doc;
  g.doc.fotos = (g.doc.fotos && typeof g.doc.fotos === "object") ? g.doc.fotos : {};
  g.doc.premios = (g.doc.premios && typeof g.doc.premios === "object") ? g.doc.premios : {};
  g.cola = (g.cola && typeof g.cola === "object") ? g.cola : base.cola;
  g.cola.nuevos = Array.isArray(g.cola.nuevos) ? g.cola.nuevos : [];
  g.cola.borrados = Array.isArray(g.cola.borrados) ? g.cola.borrados : [];
  g.sonido = g.sonido !== false;
  g.vista = g.vista === "semana" ? "semana" : "hoy";
  if (!g.familia) g.familia = nuevoCodigo();
  return g;
}
function guardar(){
  try { localStorage.setItem(CLAVE, JSON.stringify(local)); } catch(e){}
}

/* ---------------- sincronizacion ---------------- */
function pedirSync(retraso){
  clearTimeout(temporizador);
  temporizador = setTimeout(sincronizar, retraso === undefined ? 700 : retraso);
}
function hayPendiente(){
  var c = local.cola;
  return !!(c.nuevos.length || c.borrados.length || c.config || c.fotos || c.premios);
}
function aplicarCola(){
  local.cola.borrados.forEach(function(b){
    var d = dia(b.dia, true);
    if (d.borrados.indexOf(b.id) < 0) d.borrados.push(b.id);
    d.eventos = d.eventos.filter(function(x){ return x.id !== b.id; });
  });
  local.cola.nuevos.forEach(function(ev){
    var d = dia(ev.dia, true);
    if (d.borrados.indexOf(ev.id) >= 0) return;
    if (d.eventos.some(function(x){ return x.id === ev.id; })) return;
    d.eventos.push({ id:ev.id, nina:ev.nina, tipo:ev.tipo, hora:ev.hora, ts:ev.ts });
  });
  if (local.cola.config) local.doc.config = local.cola.config;
  if (local.cola.fotos){
    local.doc.fotos = local.doc.fotos || {};
    Object.keys(local.cola.fotos).forEach(function(k){ local.doc.fotos[k] = local.cola.fotos[k]; });
  }
  if (local.cola.premios){
    local.doc.premios = local.doc.premios || {};
    Object.keys(local.cola.premios).forEach(function(k){ local.doc.premios[k] = local.cola.premios[k]; });
  }
}
function sincronizar(){
  if (!local.familia || !window.fetch) return;
  if (sincronizando){ otraVuelta = true; return; }   /* que no se pierda lo apuntado mientras se enviaba lo anterior */
  var c = local.cola;
  var nN = c.nuevos.length, nB = c.borrados.length, conf = c.config, fotos = c.fotos, premios = c.premios;
  var manda = nN || nB || conf || fotos || premios;
  sincronizando = true;
  if (manda) { red = "enviando"; pintarSync(); }
  var url = API + "/f/" + encodeURIComponent(local.familia);
  var peticion = manda
    ? fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nuevos: c.nuevos.slice(0, nN), borrados: c.borrados.slice(0, nB), config: conf || undefined, fotos: fotos || undefined, premios: premios || undefined })
      })
    : fetch(url, { cache: "no-store" });

  peticion
    .then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function(doc){
      if (!doc || typeof doc !== "object" || !doc.dias) throw new Error("respuesta rara");
      c.nuevos.splice(0, nN);
      c.borrados.splice(0, nB);
      if (conf && c.config === conf) c.config = null;
      if (fotos && c.fotos === fotos) c.fotos = null;
      if (premios && c.premios === premios) c.premios = null;
      local.doc = doc;
      aplicarCola();
      red = hayPendiente() ? "pendiente" : "ok";
      guardar();
      pintar();
      if (red === "pendiente") pedirSync(500);
    })
    .catch(function(){ red = "sin"; pintarSync(); })
    .then(function(){
      sincronizando = false;
      pintarSync();
      if (otraVuelta){ otraVuelta = false; pedirSync(200); }
    });
}
function pintarSync(){
  var b = document.getElementById("btnSync");
  var textos = {
    ok:        ["☁️ Al día", ""],
    enviando:  ["⏳ Guardando…", ""],
    pendiente: ["⏳ Pendiente", ""],
    sin:       ["⚠️ Sin conexión", "mal"],
    local:     ["📱 Solo aquí", ""]
  };
  var t = textos[red] || textos.local;
  b.textContent = t[0];
  b.className = "sync " + (t[1] || (red === "ok" ? "bien" : ""));
}

/* ---------------- sonido ---------------- */
var ctxAudio = null;
function audio(){
  if (!local.sonido) return null;
  try {
    if (!ctxAudio){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctxAudio = new AC();
    }
    if (ctxAudio.state === "suspended") ctxAudio.resume();
    return ctxAudio;
  } catch(err){ return null; }
}
function nota(ctx, hz, inicio, dur, vol, tipo){
  try {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo || "sine";
    o.frequency.setValueAtTime(hz, ctx.currentTime + inicio);
    g.gain.setValueAtTime(0.0001, ctx.currentTime + inicio);
    g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + inicio + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + inicio + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime + inicio);
    o.stop(ctx.currentTime + inicio + dur + 0.03);
  } catch(err){}
}
/* el trueno de un cohete: ruido blanco filtrado que se apaga de golpe */
var ruidoFx = null;
function bufferRuido(ctx){
  if (!ruidoFx){
    var n = Math.floor(ctx.sampleRate * .5);
    ruidoFx = ctx.createBuffer(1, n, ctx.sampleRate);
    var d = ruidoFx.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  }
  return ruidoFx;
}
function estampido(ctx, inicio, vol, agudo){
  try {
    var t = ctx.currentTime + inicio;
    var f = ctx.createBufferSource(); f.buffer = bufferRuido(ctx);
    var paso = ctx.createBiquadFilter(); paso.type = "lowpass";
    paso.frequency.setValueAtTime(agudo || 2800, t);
    paso.frequency.exponentialRampToValueAtTime(240, t + .32);
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + .4);
    f.connect(paso); paso.connect(g); g.connect(ctx.destination);
    f.start(t); f.stop(t + .46);
  } catch(err){}
}
/* el cristal que se raja: ruido agudo cortadisimo y unas esquirlas encima */
function cristal(ctx, inicio, vol){
  try {
    var t = ctx.currentTime + inicio;
    var f = ctx.createBufferSource(); f.buffer = bufferRuido(ctx);
    var paso = ctx.createBiquadFilter(); paso.type = "highpass";
    paso.frequency.setValueAtTime(1800, t);
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + .22);
    f.connect(paso); paso.connect(g); g.connect(ctx.destination);
    f.start(t); f.stop(t + .26);
    for (var i = 0; i < 6; i++){
      nota(ctx, 2200 + Math.random() * 2600, inicio + .01 + Math.random() * .18, .1, .035);
    }
  } catch(err){}
}
/* el trueno: ruido muy grave que retumba y se va */
function trueno(ctx, inicio, vol, largo){
  try {
    var t = ctx.currentTime + inicio, dur = largo || 1.5;
    var f = ctx.createBufferSource(); f.buffer = bufferRuido(ctx); f.loop = true;
    var paso = ctx.createBiquadFilter(); paso.type = "lowpass";
    paso.frequency.setValueAtTime(420, t);
    paso.frequency.exponentialRampToValueAtTime(90, t + dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .09);
    g.gain.exponentialRampToValueAtTime(vol * .45, t + dur * .45);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    f.connect(paso); paso.connect(g); g.connect(ctx.destination);
    f.start(t); f.stop(t + dur + .05);
    deslizar(ctx, 62, 34, inicio, dur * .8, vol * .8);
  } catch(err){}
}
/* nota que se desliza de una frecuencia a otra: el chispazo que sube y el batacazo que baja */
function deslizar(ctx, hz1, hz2, inicio, dur, vol, tipo){
  try {
    var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + inicio;
    o.type = tipo || "sine";
    o.frequency.setValueAtTime(hz1, t);
    o.frequency.exponentialRampToValueAtTime(hz2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch(err){}
}
function sonar(cual){
  var ctx = audio(); if (!ctx) return;
  if (cual === "bien"){
    /* fanfarria de victoria de dos segundos: corneta, acorde final y campanitas */
    [[392,.00,.14],[523,.14,.14],[659,.28,.14],[784,.42,.26],
     [784,.70,.10],[880,.81,.10],[1046,.93,.80]].forEach(function(n){
      nota(ctx, n[0], n[1], n[2], .15, "triangle");
    });
    [261,329,392,523].forEach(function(f){ nota(ctx, f, .93, .95, .075); });
    nota(ctx, 130, .93, .9, .11);
    deslizar(ctx, 1046, 3136, .95, .7, .05);
    [1568,2093,2637].forEach(function(f,i){ nota(ctx, f, 1.18 + i*.1, .55, .05); });
    /* y los truenos de los cohetes, a la vez que estallan en pantalla */
    estampido(ctx, .02, .1, 3600);
    estampido(ctx, .74, .13);
    estampido(ctx, .95, .12, 3200);
    estampido(ctx, 1.16, .16, 2200);
  }
  else if (cual === "mal"){
    /* la tormenta: el cristal que se raja, el tromboncito que baja y dos truenos */
    cristal(ctx, 0, .3);
    [[392,349],[349,311],[311,262],[262,196]].forEach(function(par,i){
      deslizar(ctx, par[0], par[1], .18 + i*.26, .28, .15, "sawtooth");
    });
    trueno(ctx, .3, .16, 1.3);
    deslizar(ctx, 196, 62, 1.24, .72, .16, "sawtooth");
    trueno(ctx, .95, .2, 1.5);
    nota(ctx, 98, 1.28, .5, .09, "square");
  }
  else if (cual === "premio"){
    /* la grande: la fanfarria entera y las campanas del premio */
    [[523,.00,.15],[659,.15,.15],[784,.30,.15],[1046,.45,.30],
     [988,.78,.13],[1046,.91,.13],[1175,1.04,.13],[1318,1.17,.95]].forEach(function(n){
      nota(ctx, n[0], n[1], n[2], .15, "triangle");
    });
    [329,415,523,659].forEach(function(f){ nota(ctx, f, 1.17, 1.1, .07); });
    nota(ctx, 164, 1.17, 1.05, .11);
    deslizar(ctx, 1318, 3520, 1.2, .85, .05);
    [2093,2637,3136,2637].forEach(function(f,i){ nota(ctx, f, 1.5 + i*.12, .6, .05); });
  }
  else if (cual === "castigo"){
    /* la derrota total: todo se hunde, y con mas tormenta encima */
    cristal(ctx, 0, .34);
    trueno(ctx, .35, .19, 1.6);
    trueno(ctx, 1.35, .23, 1.9);
    [[392,370],[370,330],[330,294],[294,247],[247,196]].forEach(function(par,i){
      deslizar(ctx, par[0], par[1], i*.24, .26, .15, "sawtooth");
    });
    [155,196,233].forEach(function(f){ nota(ctx, f, 1.2, .9, .08, "triangle"); });
    deslizar(ctx, 196, 49, 1.2, 1, .17, "sawtooth");
    nota(ctx, 82, 1.25, .8, .11, "square");
    deslizar(ctx, 110, 32, 1.9, .6, .14);
  }
  else if (cual === "deshacer"){ nota(ctx, 520, 0, .1, .1); }
}

/* ---------------- fuegos artificiales de verdad (canvas) ----------------
   Cohetes que suben, estallan y dejan estela, mas dos canones de confeti.
   El truco de la estela: en vez de borrar el lienzo, se le baja el alfa con
   destination-out, asi las estelas se apagan solas sin oscurecer la pagina. */
var lienzoFx = document.getElementById("fuegos"), fctx = null;
var brasas = [], cohetes = [], papeles = [], ardiendo = false;
var grietas = [], trozos = [], lluvia = [];
var relojFx = 0, finFuegos = 0, finLluvia = 0;
function ahoraMs(){
  return (window.performance && performance.now) ? performance.now() : Date.now();
}
var BRASAS = {};
var PALETA = [[255,206,84],[255,138,80],[255,90,140],[120,200,255],[150,255,190],[200,150,255]];

function brasa(rgb){
  var clave = rgb.join(",");
  if (BRASAS[clave]) return BRASAS[clave];
  var t = 44, c = document.createElement("canvas");
  c.width = c.height = t;
  var g = c.getContext("2d"), rad = g.createRadialGradient(t/2, t/2, 0, t/2, t/2, t/2);
  rad.addColorStop(0,   "rgba(255,255,255,.8)");
  rad.addColorStop(.1,  "rgba(" + clave + ",.95)");
  rad.addColorStop(.45, "rgba(" + clave + ",.42)");
  rad.addColorStop(1,   "rgba(" + clave + ",0)");
  g.fillStyle = rad; g.fillRect(0, 0, t, t);
  BRASAS[clave] = c;
  return c;
}
function medirLienzo(){
  var r = window.devicePixelRatio || 1;
  lienzoFx.width = window.innerWidth * r; lienzoFx.height = window.innerHeight * r;
  lienzoFx.style.width = window.innerWidth + "px"; lienzoFx.style.height = window.innerHeight + "px";
  fctx.setTransform(r, 0, 0, r, 0, 0);
}
function sembrarBrasas(x, y, cuantas, fuerza, rgb, mezcla){
  for (var i = 0; i < cuantas; i++){
    var ang = Math.random() * Math.PI * 2;
    var v = fuerza * (.25 + Math.random() * .75);
    brasas.push({
      x:x, y:y, vx:Math.cos(ang)*v, vy:Math.sin(ang)*v,
      g:.09 + Math.random()*.06, vida:1, baja:.011 + Math.random()*.012,
      t:15 + Math.random()*23,
      c: mezcla ? PALETA[(Math.random()*PALETA.length)|0] : rgb
    });
  }
}
/* el destello blanco del instante del estallido */
function fogata(x, y){
  for (var i = 0; i < 3; i++){
    brasas.push({ x:x, y:y, vx:(Math.random()-.5)*1.2, vy:(Math.random()-.5)*1.2,
                  g:0, vida:.8, baja:.16, t:38 + Math.random()*22, c:[255,240,200] });
  }
}
function lanzarFuegos(foco, acento){
  if (!lienzoFx || !lienzoFx.getContext) return;
  fctx = fctx || lienzoFx.getContext("2d");
  lienzoFx.className = "fiesta";
  lienzoFx.hidden = false;
  medirLienzo();
  var an = window.innerWidth, al = window.innerHeight;
  var arranque = ahoraMs();
  finFuegos = arranque + 3400;                /* pase lo que pase, a los 3,4 s se acaba */
  relojFx = arranque;

  /* 1. el estallido de la propia estrella */
  sembrarBrasas(foco.x, foco.y, 70, 7.5, [255,206,84], false);
  sembrarBrasas(foco.x, foco.y, 26, 4.5, acento, false);

  /* 2. tres cohetes que suben desde abajo y estallan a media altura */
  for (var i = 0; i < 3; i++){
    cohetes.push({
      x: an * (.18 + Math.random() * .64), y: al + 12,
      vx: (Math.random() - .5) * 1.8, vy: -(13.5 + Math.random() * 3),
      sale: arranque + 50 + i * 200 + Math.random() * 80,
      techo: al * (.14 + Math.random() * .26),
      grande: i === 2,
      c: PALETA[(Math.random() * PALETA.length) | 0]
    });
  }

  /* 3. dos canones de confeti desde las esquinas de abajo */
  var colores = ["#e46a8b","#7b6cd9","#2aa8a8","#f0a92c","#2e9c6b","#e0574f","#f7c948"];
  [[0, -1.02], [an, -2.12]].forEach(function(canon){
    for (var k = 0; k < 55; k++){
      var v = 13 + Math.random() * 9, ang = canon[1] + (Math.random() - .5) * .5;
      papeles.push({
        x: canon[0], y: al + 6,
        vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
        an: 5 + Math.random() * 6, al: 8 + Math.random() * 9,
        giro: Math.random() * Math.PI, vgiro: -.2 + Math.random() * .4,
        vida: 1, color: colores[k % colores.length]
      });
    }
  });

  if (!ardiendo){ ardiendo = true; requestAnimationFrame(pintarFuegos); }
}
/* Todo se mueve por reloj y no por fotograma: en un movil que va a 20 fps la
   traca dura lo mismo (se ve mas a saltos, pero no en camara lenta) y no se
   desengancha de la musica ni de la animacion de la estrella. */
/* ---- la tormenta: lo mismo que la traca, pero al reves ----
   El cristal se raja desde el punto del golpe, caen los trozos del corazon,
   llueve de verdad y truena. Las grietas se repintan enteras cada fotograma,
   por eso el borrado parcial del lienzo no se las come. */
function desatarTormenta(foco){
  if (!lienzoFx || !lienzoFx.getContext) return;
  fctx = fctx || lienzoFx.getContext("2d");
  lienzoFx.className = "tormenta";
  lienzoFx.hidden = false;
  medirLienzo();
  var an = window.innerWidth, al = window.innerHeight, i, k;
  var arranque = ahoraMs();
  finFuegos = arranque + 3400;
  finLluvia = arranque + 2350;             /* amaina antes de que vuelva la luz */
  relojFx = arranque;

  /* 1. la raja del cristal: radios quebrados desde el golpe, con ramas y anillos */
  var largoMax = Math.max(an, al), radios = [];
  var cuantos = 13;
  for (i = 0; i < cuantos; i++){
    var ang = (i / cuantos) * Math.PI * 2 + (Math.random() - .5) * .38;
    var largo = largoMax * (.42 + Math.random() * .6);
    var tramos = 5 + (Math.random() * 3 | 0), puntos = [];
    for (k = 1; k <= tramos; k++){
      var d = largo * (k / tramos), desv = (Math.random() - .5) * largo * .11;
      puntos.push({
        x: Math.cos(ang) * d - Math.sin(ang) * desv,
        y: Math.sin(ang) * d + Math.cos(ang) * desv,
        f: k / tramos
      });
    }
    var rama = null;
    if (Math.random() < .55){
      var desde = puntos[1 + (Math.random() * 2 | 0)];
      var angR = ang + (Math.random() < .5 ? -1 : 1) * (.5 + Math.random() * .5);
      var largoR = largo * (.22 + Math.random() * .28);
      rama = { desde:desde, x: desde.x + Math.cos(angR) * largoR, y: desde.y + Math.sin(angR) * largoR };
    }
    radios.push({ puntos:puntos, rama:rama });
  }
  grietas.push({ x:foco.x, y:foco.y, radios:radios, anillos:[.24, .5, .78], nace:arranque, vida:1 });

  /* 2. los trozos del corazon, que caen y rebotan en el suelo */
  var rojos = ["#e0574f","#b9433c","#f07f78","#8e2f2a","#d9455f"];
  for (i = 0; i < 18; i++){
    trozos.push({
      x: foco.x, y: foco.y,
      vx: (Math.random() - .5) * 15, vy: -5 - Math.random() * 8,
      giro: Math.random() * 6.28, vgiro: (Math.random() - .5) * .4,
      t: 9 + Math.random() * 18, rebotes: 2, vida: 1,
      c: rojos[i % rojos.length]
    });
  }

  /* 3. la lluvia, que ya estaba cayendo antes de empezar */
  for (i = 0; i < 130; i++){
    lluvia.push({
      x: Math.random() * an * 1.25 - an * .12,
      y: Math.random() * al * 1.6 - al * .6,
      v: 15 + Math.random() * 13, l: 11 + Math.random() * 17
    });
  }

  if (!ardiendo){ ardiendo = true; requestAnimationFrame(pintarFuegos); }
}
function pintarGrieta(g, ahora){
  var avance = Math.min(1, (ahora - g.nace) / 190);          /* se raja de golpe */
  var apaga  = Math.max(0, 1 - Math.max(0, ahora - g.nace - 1500) / 800);
  if (apaga <= 0) return false;
  var i, k, r, pt;
  fctx.save();
  fctx.translate(g.x, g.y);
  fctx.lineCap = "round"; fctx.lineJoin = "round";
  fctx.shadowColor = "rgba(10,14,40,.85)"; fctx.shadowBlur = 7;
  for (i = 0; i < g.radios.length; i++){
    r = g.radios[i];
    fctx.strokeStyle = "rgba(255,255,255," + (.88 * apaga).toFixed(3) + ")";
    fctx.lineWidth = 2.6;
    fctx.beginPath(); fctx.moveTo(0, 0);
    for (k = 0; k < r.puntos.length; k++){
      pt = r.puntos[k];
      if (pt.f > avance) break;
      fctx.lineTo(pt.x, pt.y);
    }
    fctx.stroke();
    if (r.rama && avance > r.rama.desde.f + .12){
      fctx.lineWidth = 1.5;
      fctx.beginPath();
      fctx.moveTo(r.rama.desde.x, r.rama.desde.y);
      fctx.lineTo(r.rama.x, r.rama.y);
      fctx.stroke();
    }
  }
  /* los anillos que unen unos radios con otros */
  fctx.lineWidth = 1.6;
  fctx.strokeStyle = "rgba(255,255,255," + (.6 * apaga).toFixed(3) + ")";
  for (i = 0; i < g.anillos.length; i++){
    var f = g.anillos[i];
    if (avance < f + .1) continue;
    fctx.beginPath();
    for (k = 0; k <= g.radios.length; k++){
      var rr = g.radios[k % g.radios.length];
      var p1 = rr.puntos[Math.min(rr.puntos.length - 1, Math.round(f * rr.puntos.length))];
      if (k === 0) fctx.moveTo(p1.x * f * 1.6, p1.y * f * 1.6);
      else fctx.lineTo(p1.x * f * 1.6, p1.y * f * 1.6);
    }
    fctx.stroke();
  }
  fctx.restore();
  fctx.shadowBlur = 0;
  return true;
}
function pintarFuegos(marca){
  var an = window.innerWidth, al = window.innerHeight, i, p;
  var ahora = marca || ahoraMs();
  var paso = Math.min(3.5, Math.max(.2, (ahora - relojFx) / 16.667));
  relojFx = ahora;
  var seAcaba = ahora > finFuegos;

  /* apaga poco a poco lo pintado antes: eso son las estelas */
  fctx.globalCompositeOperation = "destination-out";
  fctx.fillStyle = "rgba(0,0,0," + (1 - Math.pow(.72, paso)).toFixed(3) + ")";
  fctx.fillRect(0, 0, an, al);

  /* los cohetes y las brasas brillan sumando luz */
  fctx.globalCompositeOperation = "lighter";
  for (i = cohetes.length - 1; i >= 0; i--){
    p = cohetes[i];
    if (ahora < p.sale) continue;
    p.x += p.vx * paso; p.y += p.vy * paso; p.vy += .3 * paso;
    fctx.globalAlpha = .95;
    fctx.drawImage(brasa(p.c), p.x - 10, p.y - 10, 20, 20);
    if (p.vy > -2.2 || p.y < p.techo){
      /* el ultimo es el de la traca final */
      sembrarBrasas(p.x, p.y, p.grande ? 120 : 90, p.grande ? 11.5 : 9, p.c, p.grande || Math.random() < .5);
      fogata(p.x, p.y);                       /* el destello del propio estallido */
      cohetes.splice(i, 1);
    }
  }
  for (i = brasas.length - 1; i >= 0; i--){
    p = brasas[i];
    p.x += p.vx * paso; p.y += p.vy * paso;
    var freno = Math.pow(.986, paso);
    p.vx *= freno; p.vy = p.vy * freno + p.g * paso;
    p.vida -= p.baja * paso;
    if (p.vida <= 0 || p.y > al + 40){ brasas.splice(i, 1); continue; }
    fctx.globalAlpha = p.vida * .58;
    var t = p.t * (.45 + p.vida * .55);
    fctx.drawImage(brasa(p.c), p.x - t/2, p.y - t/2, t, t);
  }

  /* de aqui en adelante ya no es luz, es materia */
  fctx.globalCompositeOperation = "source-over";
  fctx.globalAlpha = 1;

  /* la lluvia */
  if (lluvia.length){
    /* amaina en el ultimo medio segundo, para no seguir lloviendo con la luz puesta */
    var fuerza = Math.max(0, Math.min(1, (finLluvia - ahora) / 500));
    if (fuerza <= 0){ lluvia = []; }
  }
  if (lluvia.length){
    fctx.strokeStyle = "rgba(198,218,255," + (.5 * fuerza).toFixed(3) + ")";
    fctx.lineWidth = 1.5; fctx.lineCap = "round";
    fctx.beginPath();
    for (i = 0; i < lluvia.length; i++){
      p = lluvia[i];
      p.x += p.v * .22 * paso; p.y += p.v * paso;
      if (p.y - p.l > al){ p.y = -p.l - Math.random() * al * .3; p.x = Math.random() * an * 1.25 - an * .12; }
      fctx.moveTo(p.x, p.y);
      fctx.lineTo(p.x - p.l * .22, p.y - p.l);
    }
    fctx.stroke();
  }

  /* los trozos del corazon */
  for (i = trozos.length - 1; i >= 0; i--){
    p = trozos[i];
    p.x += p.vx * paso; p.y += p.vy * paso; p.vy += .42 * paso;
    p.vx *= Math.pow(.995, paso); p.giro += p.vgiro * paso;
    if (p.y > al - 6 && p.rebotes > 0 && p.vy > 0){
      p.y = al - 6; p.vy *= -.42; p.vx *= .62; p.vgiro *= .5; p.rebotes--;
    }
    if (p.rebotes <= 0) p.vida -= .014 * paso;
    if (p.vida <= 0 || p.y > al + 60){ trozos.splice(i, 1); continue; }
    fctx.globalAlpha = Math.max(0, p.vida);
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.giro);
    fctx.fillStyle = p.c;
    fctx.beginPath();
    fctx.moveTo(0, -p.t * .6); fctx.lineTo(p.t * .5, p.t * .45); fctx.lineTo(-p.t * .45, p.t * .5);
    fctx.closePath(); fctx.fill();
    fctx.restore();
    fctx.globalAlpha = 1;
  }

  /* y la raja del cristal, repintada entera cada vez */
  for (i = grietas.length - 1; i >= 0; i--){
    if (!pintarGrieta(grietas[i], ahora)) grietas.splice(i, 1);
  }
  for (i = papeles.length - 1; i >= 0; i--){
    p = papeles[i];
    p.x += p.vx * paso; p.y += p.vy * paso;
    var roce = Math.pow(.992, paso);
    p.vx *= roce; p.vy = p.vy * roce + .3 * paso;
    p.giro += p.vgiro * paso;
    if (p.y > al + 40 || p.x < -60 || p.x > an + 60){ papeles.splice(i, 1); continue; }
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.giro);
    fctx.fillStyle = p.color;
    fctx.fillRect(-p.an/2, -p.al/2, p.an, p.al * Math.abs(Math.cos(p.giro)));
    fctx.restore();
  }

  if (!seAcaba && (brasas.length || cohetes.length || papeles.length ||
                   grietas.length || trozos.length || lluvia.length)){
    requestAnimationFrame(pintarFuegos);
  } else {
    ardiendo = false;
    brasas = []; cohetes = []; papeles = [];
    grietas = []; trozos = []; lluvia = [];
    fctx.setTransform(1,0,0,1,0,0);
    fctx.clearRect(0, 0, lienzoFx.width, lienzoFx.height);
    lienzoFx.hidden = true;
  }
}
function aRGB(hex){
  var n = parseInt(hex.replace("#",""), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

/* ---------------- fogonazo: la super animacion, a pantalla completa ---------------- */
var capaFx = document.getElementById("fogonazo"), tempFx = null, tempCuerpo = null;
var capaNoche = document.getElementById("noche"), tempNoche = null;
var quietud = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
function icono(c){ return String.fromCodePoint(c); }
var ASTRO_BIEN = icono(0x2B50), ASTRO_MAL = icono(0x1F494);
var CHISPAS_BIEN = [0x2B50, 0x2728, 0x1F31F, 0x1F389, 0x2728, 0x1F38A].map(icono);
var CHISPAS_MAL  = [0x1F4A5, 0x1F5A4, 0x1F4A2, 0x1F494, 0x1F5A4].map(icono);
var LLUVIA_BIEN  = [0x2B50, 0x2728, 0x1F31F, 0x1F388].map(icono);
var LLUVIA_MAL   = [0x1F4A7, 0x1F5A4, 0x1F494, 0x1F4A2].map(icono);
var GRITOS_BIEN  = ["¡MUY BIEN!", "¡GENIAL!", "¡BRAVO!", "¡CAMPEONA!", "¡ASÍ SE HACE!"];
var GRITOS_MAL   = ["¡OH, NO!", "¡VAYA...!", "¡UY!"];
function alAzar(lista){ return lista[Math.floor(Math.random() * lista.length)]; }

/* de donde sale el estallido: el centro de la tarjeta de la nina, o el de la pantalla */
function focoDe(ninaId){
  var x = window.innerWidth / 2, y = window.innerHeight * 0.44;
  var t = ninaId ? document.querySelector('[data-tarjeta="' + ninaId + '"]') : null;
  if (t && t.getBoundingClientRect){
    var r = t.getBoundingClientRect();
    if (r.width > 0 && r.height > 0){
      x = r.left + r.width / 2;
      y = Math.min(Math.max(r.top + r.height * 0.42, window.innerHeight * 0.28), window.innerHeight * 0.66);
    }
  }
  return { x:x, y:y };
}
function fogonazo(tipo, ninaId){
  if (!capaFx) return;
  if (quietud && quietud.matches) return;   /* si el movil pide menos movimiento, no molestamos */
  var gana = tipo === "gana";
  var an = window.innerWidth, al = window.innerHeight;
  var foco = focoDe(ninaId);
  var nina = NINAS.filter(function(n){ return n.id === ninaId; })[0];
  capaFx.style.setProperty("--cx", Math.round(foco.x) + "px");
  capaFx.style.setProperty("--cy", Math.round(foco.y) + "px");
  capaFx.style.setProperty("--tinte", gana ? "rgba(247,201,72,.55)" : "rgba(224,87,79,.5)");
  capaFx.style.setProperty("--vivo",  gana ? "#f7c948" : "#e0574f");
  capaFx.style.setProperty("--letra", gana ? "#c98a06" : "#b9433c");

  var html = gana ? '<span class="relampago"></span><span class="rayos"></span>'
                  : '<span class="vineta"></span><span class="rayo"></span>';
  html += '<span class="destello"></span>' +
          '<span class="onda"></span><span class="onda dos"></span><span class="onda tres"></span>' +
          '<span class="astro ' + (gana ? "gana" : "pierde") + '">' + (gana ? ASTRO_BIEN : ASTRO_MAL) + '</span>' +
          '<span class="cartel"><b>' + esc(alAzar(gana ? GRITOS_BIEN : GRITOS_MAL)) + '</b>' +
            (nina ? '<i>' + esc(nina.nombre.toUpperCase()) + '</i>' : '') + '</span>';
  if (gana) html += '<span class="masuno">+1 ' + ASTRO_BIEN + '</span>';

  /* chispas: cruzan la pantalla entera desde el foco */
  var trozos = gana ? CHISPAS_BIEN : CHISPAS_MAL;
  var lejos = Math.max(an, al) * 0.62;
  for (var i = 0; i < 34; i++){
    var ang, dist, x, y;
    if (gana){
      ang  = (i / 34) * Math.PI * 2 + (Math.random() - .5) * .28;
      dist = lejos * (.45 + Math.random() * .75);
      x = Math.cos(ang) * dist;
      y = Math.sin(ang) * dist - al * .06;
    } else {
      ang  = Math.PI * .08 + Math.random() * Math.PI * .84;
      dist = lejos * (.35 + Math.random() * .7);
      x = Math.cos(ang) * dist;
      y = Math.abs(Math.sin(ang)) * dist + al * .08;
    }
    html += '<span class="chispa" style="' +
              'font-size:' + (1.1 + Math.random() * 1.7).toFixed(2) + 'rem;' +
              '--x:' + Math.round(x) + 'px;--y:' + Math.round(y) + 'px;' +
              '--e:' + (gana ? (.8 + Math.random() * 1) : (.5 + Math.random() * .7)).toFixed(2) + ';' +
              '--g:' + Math.round((gana ? 1 : -1) * (180 + Math.random() * 540)) + 'deg;' +
              '--t:' + (.95 + Math.random() * .5).toFixed(2) + 's;' +
              '--r:' + (Math.random() * .16).toFixed(3) + 's' +
            '">' + trozos[i % trozos.length] + '</span>';
  }
  /* y encima cae una cortina de lado a lado */
  var gotas = gana ? LLUVIA_BIEN : LLUVIA_MAL;
  var cuantasGotas = gana ? 22 : 10;       /* en la tormenta ya cae lluvia de verdad */
  for (var j = 0; j < cuantasGotas; j++){
    html += '<span class="gota" style="' +
              'font-size:' + (1 + Math.random() * 1.5).toFixed(2) + 'rem;' +
              '--l:' + (2 + (j / cuantasGotas) * 96 + Math.random() * 3).toFixed(1) + '%;' +
              '--g:' + Math.round((Math.random() - .5) * 900) + 'deg;' +
              '--t:' + (1.5 + Math.random() * .8).toFixed(2) + 's;' +
              '--r:' + (Math.random() * .55).toFixed(3) + 's' +
            '">' + gotas[j % gotas.length] + '</span>';
  }

  capaFx.innerHTML = html;
  capaFx.hidden = false;
  clearTimeout(tempFx);
  tempFx = setTimeout(function(){ capaFx.hidden = true; capaFx.innerHTML = ""; }, 2600);

  /* se apaga la luz en las dos: para la traca y para la tormenta */
  if (capaNoche){
    capaNoche.hidden = true;
    void capaNoche.offsetWidth;            /* para que la animacion vuelva a empezar */
    capaNoche.className = gana ? "" : "tormenta";
    capaNoche.hidden = false;
    clearTimeout(tempNoche);
    tempNoche = setTimeout(function(){ capaNoche.hidden = true; }, 2550);
  }
  if (gana) lanzarFuegos(foco, aRGB(nina ? nina.acento : "#f7c948"));
  else      desatarTormenta(foco);

  /* la pagina de debajo tambien se entera */
  var cuerpo = document.body;
  cuerpo.classList.remove("celebra", "sacude");
  void cuerpo.offsetWidth;                         /* reinicia la animacion si se pulsa seguido */
  cuerpo.classList.add(gana ? "celebra" : "sacude");
  clearTimeout(tempCuerpo);
  tempCuerpo = setTimeout(function(){ cuerpo.classList.remove("celebra", "sacude"); }, 900);

  try {
    if (navigator.vibrate) navigator.vibrate(gana ? [22,50,22,50,30,60,120] : [130,70,60,50,180]);
  } catch(err){}
}

/* ---------------- confeti ---------------- */
var lienzo = document.getElementById("confeti"), cctx = null, trozos = [], animando = false, tempConfeti = null;
function confeti(){
  if (!lienzo.getContext) return;
  cctx = cctx || lienzo.getContext("2d");
  lienzo.hidden = false;
  var r = window.devicePixelRatio || 1;
  lienzo.width = window.innerWidth * r; lienzo.height = window.innerHeight * r;
  lienzo.style.width = window.innerWidth + "px"; lienzo.style.height = window.innerHeight + "px";
  cctx.setTransform(r,0,0,r,0,0);
  var colores = ["#e46a8b","#7b6cd9","#2aa8a8","#f0a92c","#2e9c6b","#e0574f"];
  for (var i=0;i<140;i++){
    trozos.push({
      x: Math.random()*window.innerWidth,
      y: -20 - Math.random()*window.innerHeight*0.5,
      an: 6 + Math.random()*7, al: 9 + Math.random()*10,
      vy: 2.2 + Math.random()*3.4, vx: -1.4 + Math.random()*2.8,
      giro: Math.random()*Math.PI, vgiro: -0.16 + Math.random()*0.32,
      color: colores[i % colores.length]
    });
  }
  if (!animando){ animando = true; requestAnimationFrame(pintarConfeti); }
  clearTimeout(tempConfeti);
  tempConfeti = setTimeout(function(){ trozos = []; }, 3400);
}
function pintarConfeti(){
  cctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  for (var i=trozos.length-1;i>=0;i--){
    var p = trozos[i];
    p.x += p.vx; p.y += p.vy; p.giro += p.vgiro; p.vy += 0.02;
    if (p.y > window.innerHeight + 30){ trozos.splice(i,1); continue; }
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.giro);
    cctx.fillStyle = p.color; cctx.fillRect(-p.an/2, -p.al/2, p.an, p.al);
    cctx.restore();
  }
  if (trozos.length){ requestAnimationFrame(pintarConfeti); }
  else { animando = false; lienzo.hidden = true; }
}

/* manda el NETO: estrellas ganadas menos corazones perdidos.
   Si dos empatan a neto, va delante quien mas estrellas ha hecho; y si tambien
   empatan ahi, quien menos corazones ha perdido. */
function ordenar(lista){
  lista.forEach(function(x){ x.neto = x.estrellas - x.perdidos; });
  lista.sort(function(a,b){
    if (b.neto !== a.neto) return b.neto - a.neto;
    if (b.estrellas !== a.estrellas) return b.estrellas - a.estrellas;
    return a.perdidos - b.perdidos;
  });
  var igual = function(a,b){ return a.neto === b.neto && a.estrellas === b.estrellas && a.perdidos === b.perdidos; };
  var empate = lista.every(function(x){ return igual(x, lista[0]); });
  var puesto = 0, ant = null;
  lista.forEach(function(x,i){
    if (!ant || !igual(x, ant)){ puesto = i+1; ant = x; }
    x.puesto = puesto;
    x.empate = empate;
  });
  return lista;
}
/* el neto, tal y como se canta en el ranking */
function chapaNeto(n){
  var clase = n > 0 ? " bien" : n < 0 ? " mal" : "";
  return '<span class="neto' + clase + '">' + (n > 0 ? "+" : "") + n + '</span>';
}
function medalla(x){
  if (x.empate) return '<span class="puesto igualados">–</span>';
  var m = { 1:"🥇", 2:"🥈", 3:"🥉" }[x.puesto] || (x.puesto + "º");
  return '<span class="puesto">' + m + '</span>';
}

/* tira pequena con los premios que le quedan por canjear y la racha */
function logros(n){
  var pendientes = premiosDe(n.id, "ganado").length, dias = racha(n.id), trozos = [];
  if (pendientes) trozos.push('<button class="logro premio" type="button" data-premios="' + n.id + '">🎁 ' + pendientes + ' por dar</button>');
  if (dias >= 2) trozos.push('<span class="logro">🔥 ' + dias + ' días</span>');
  return trozos.length ? '<div class="logros">' + trozos.join("") + '</div>' : "";
}
var escaparateAbierto = false;
function abrirEscaparate(){ escaparateAbierto = true; document.getElementById("escaparate").hidden = false; document.body.style.overflow = "hidden"; pintarEscaparate(); }
function cerrarEscaparate(){ escaparateAbierto = false; document.getElementById("escaparate").hidden = true; document.body.style.overflow = ""; }
function pintarEscaparate(){
  if (!escaparateAbierto) return;
  var c = cfg(), d = hoy();
  /* en el mismo orden que el ranking: primero la que va ganando */
  var lista = ordenar(NINAS.map(function(n){
    var m = marcador(d, n.id, c);
    return { nina:n, m:m, estrellas:m.estrellas, perdidos:m.perdidos };
  }));
  document.getElementById("escaparateLista").innerHTML = lista.map(function(x){
    var n = x.nina, m = x.m, i, pips = "", estrellas = "";
    for (i=0;i<c.oportunidades;i++) pips += '<span class="' + (i < m.corazones ? "" : "vacio") + '">' + (i < m.corazones ? "❤️" : "🖤") + '</span>';
    for (i=0;i<Math.max(c.objetivo, m.estrellas);i++) estrellas += '<span class="' + (i < m.estrellas ? "" : "vacio") + '">⭐</span>';
    var pendientes = premiosDe(n.id, "ganado").length, dias = racha(n.id), estado;
    if (m.castigada) estado = '<div class="esc-estado mal">⛔ ' + esc(c.textoCastigo).toUpperCase() + '</div>';
    else if (m.premiada) estado = '<div class="esc-estado bien">🎁 ¡PREMIO! ' + esc(c.textoRecompensa) + '</div>';
    else {
      var trozos = [];
      if (pendientes) trozos.push("🎁 " + pendientes + (pendientes > 1 ? " premios" : " premio"));
      if (dias >= 2) trozos.push("🔥 " + dias + " días sin castigo");
      trozos.push("te faltan " + Math.max(0, c.objetivo - m.estrellas) + " ⭐");
      estado = '<div class="esc-estado normal">' + trozos.join(" · ") + '</div>';
    }
    var foto = fotoDe(n.id);
    var medallas = { 1:"🥇", 2:"🥈", 3:"🥉" };
    var puesto = x.empate ? "" : '<span class="esc-puesto">' + (medallas[x.puesto] || x.puesto + "º") + '</span>';
    return '<div class="esc-nina' + (m.castigada ? " castigada" : m.premiada ? " premiada" : "") + '" style="--acento:' + n.acento + '">' +
             '<span class="esc-foto' + (foto ? " confoto" : "") + '"' + (foto ? ' style="background-image:url(' + foto + ')"' : '') + '>' + n.nombre.charAt(0) + '</span>' +
             '<div class="esc-datos">' +
               '<div class="esc-nombre">' + n.nombre + puesto + '</div>' +
               '<div class="esc-pips">' + pips + '</div>' +
               '<div class="esc-pips">' + estrellas + '</div>' +
               estado +
             '</div>' +
           '</div>';
  }).join("");
}
function pintarHistorial(){
  var ul = document.getElementById("historial");
  var evs = eventosDe(hoy()).slice().sort(function(a,b){ return (a.ts||0) - (b.ts||0); });
  if (!evs.length){
    ul.innerHTML = '<li class="vacio">Todavía no hay nada apuntado hoy.</li>';
    return;
  }
  ul.innerHTML = evs.reverse().map(function(h){
    var n = NINAS.filter(function(x){ return x.id === h.nina; })[0];
    var txt = h.tipo === "bien" ? "⭐ Buena acción" : "💔 Perdió una oportunidad";
    return '<li><span class="hora">' + esc(h.hora) + '</span><span class="quien">' + esc(n ? n.nombre : h.nina) + '</span><span>' + txt + '</span></li>';
  }).join("");
}

/* ---------------- acciones ---------------- */
function ultimoEvento(d, ninaId){
  var ult = null;
  eventosDe(d).forEach(function(e){
    if (e.nina !== ninaId) return;
    if (!ult || (e.ts || 0) >= (ult.ts || 0)) ult = e;
  });
  return ult;
}
function apuntar(id, tipo){
  var c = cfg(), d = hoy(), antes = marcador(d, id, c);
  if (tipo === "mal" && antes.castigada) return;
  var ev = { id:uid(), dia:d, nina:id, tipo:tipo, hora:ahora(), ts:Date.now() };
  dia(d, true).eventos.push({ id:ev.id, nina:ev.nina, tipo:ev.tipo, hora:ev.hora, ts:ev.ts });
  local.cola.nuevos.push(ev);
  var despues = marcador(d, id, c);
  if (tipo === "mal"){
    efectos[id] = { tipo:"pierde" };
    fogonazo("pierde", id);
    sonar(despues.castigada ? "castigo" : "mal");
  } else {
    efectos[id] = { tipo:"gana" };
    fogonazo("gana", id);
    if (!antes.premiada && despues.premiada){ sonar("premio"); confeti(); }
    else sonar("bien");
  }
  red = "pendiente";
  guardar(); pintar(); pedirSync();
}
function deshacer(id){
  var d = hoy(), ult = ultimoEvento(d, id);
  if (!ult) return;
  var x = dia(d, true);
  x.eventos = x.eventos.filter(function(e){ return e.id !== ult.id; });
  if (x.borrados.indexOf(ult.id) < 0) x.borrados.push(ult.id);
  local.cola.nuevos = local.cola.nuevos.filter(function(e){ return e.id !== ult.id; });
  local.cola.borrados.push({ dia:d, id:ult.id });
  sonar("deshacer");
  red = "pendiente";
  guardar(); pintar(); pedirSync();
}
function nuevoDia(){
  var d = hoy(), x = dia(d, true);
  x.eventos.forEach(function(e){
    if (x.borrados.indexOf(e.id) < 0) x.borrados.push(e.id);
    local.cola.borrados.push({ dia:d, id:e.id });
  });
  x.eventos = [];
  local.cola.nuevos = local.cola.nuevos.filter(function(e){ return e.dia !== d; });
  red = "pendiente";
  guardar(); pintar(); pedirSync(0);
}
function guardarConfig(nueva){
  nueva.ts = Date.now();
  local.doc.config = nueva;
  local.cola.config = nueva;
  red = "pendiente";
  guardar(); pintar(); pedirSync(0);
}

/* ---------------- paneles ---------------- */
var velo = document.getElementById("velo"), hoja = document.getElementById("hoja");
function abrirHoja(html){
  hoja.innerHTML = html;
  velo.hidden = false;
  document.body.style.overflow = "hidden";
}
function cerrarHoja(){

}
velo.addEventListener("click", function(e){ if (e.target === velo) cerrarHoja(); });

function abrirAjustes(){
  var c = cfg();
  abrirHoja('' +
    '<h2>⚙️ Ajustes</h2>' +
    '<p class="sub">Valen para las tres y se aplican en los dos móviles.</p>' +
    '<div class="numeros">' +
      '<div class="campo"><label for="cfgOp">❤️ Oportunidades</label><input id="cfgOp" type="number" inputmode="numeric" min="1" max="10" value="' + c.oportunidades + '"></div>' +
      '<div class="campo"><label for="cfgOb">⭐ Para el premio</label><input id="cfgOb" type="number" inputmode="numeric" min="1" max="10" value="' + c.objetivo + '"></div>' +
    '</div>' +
    '<div class="campo"><label for="cfgRe">🎁 Texto de la recompensa</label><input id="cfgRe" type="text" maxlength="60" value="' + esc(c.textoRecompensa) + '"></div>' +
    '<div class="campo"><label for="cfgCa">⛔ Texto del castigo</label><input id="cfgCa" type="text" maxlength="30" value="' + esc(c.textoCastigo) + '"></div>' +
    '<button class="grande bien" type="button" id="cfgGuardar">GUARDAR</button>' +
    '<button class="secundario" type="button" id="cfgFotos">📷 Fotos de las niñas</button>' +
    '<button class="secundario" type="button" id="cfgPremios">🎁 Premios ganados</button>' +
    '<button class="secundario" type="button" id="cfgCompartir">📲 Compartir con el otro móvil</button>' +
    '<button class="secundario" type="button" data-cerrar>Cancelar</button>'
  );
  document.getElementById("cfgGuardar").addEventListener("click", function(){
    guardarConfig({
      oportunidades: limitar(parseInt(document.getElementById("cfgOp").value,10), 1, 10, POR_DEFECTO.oportunidades),
      objetivo:      limitar(parseInt(document.getElementById("cfgOb").value,10), 1, 10, POR_DEFECTO.objetivo),
      textoRecompensa: (document.getElementById("cfgRe").value || "").trim() || POR_DEFECTO.textoRecompensa,
      textoCastigo:    (document.getElementById("cfgCa").value || "").trim() || POR_DEFECTO.textoCastigo
    });
    cerrarHoja();
  });
  document.getElementById("cfgCompartir").addEventListener("click", abrirCompartir);
  document.getElementById("cfgFotos").addEventListener("click", abrirFotos);
  document.getElementById("cfgPremios").addEventListener("click", abrirPremios);
}
function abrirFotos(){
  abrirHoja('' +
    '<h2>📷 Fotos de las niñas</h2>' +
    '<p class="sub">Sale en su tarjeta y en el ranking. La foto se guarda pequeña y solo la ven los móviles con vuestro código: no se publica en ningún sitio.</p>' +
    NINAS.map(function(n){
      return '<div class="fotofila" style="--acento:' + n.acento + '" data-fotofila="' + n.id + '">' +
               avatar(n) +
               '<span class="quien">' + n.nombre + '</span>' +
               '<label for="foto-' + n.id + '" data-elegir="' + n.id + '">' + (fotoDe(n.id) ? "Cambiar" : "Elegir foto") + '</label>' +
               '<input type="file" id="foto-' + n.id + '" accept="image/*" data-foto="' + n.id + '">' +
               (fotoDe(n.id) ? '<button class="quitar" type="button" data-quitarfoto="' + n.id + '" aria-label="Quitar la foto">🗑️</button>' : '') +
             '</div>';
    }).join("") +
    '<button class="grande bien" type="button" data-cerrar style="margin-top:16px">LISTO</button>'
  );
  Array.prototype.forEach.call(hoja.querySelectorAll("input[type=file]"), function(inp){
    inp.addEventListener("change", function(){
      var f = inp.files && inp.files[0];
      if (!f) return;
      var etiqueta = hoja.querySelector('[data-elegir="' + inp.getAttribute("data-foto") + '"]');
      if (etiqueta) etiqueta.textContent = "Un momento…";
      miniatura(f, function(dato){
        if (!dato){ if (etiqueta) etiqueta.textContent = "No se pudo leer"; return; }
        guardarFoto(inp.getAttribute("data-foto"), dato);
        abrirFotos();
      });
    });
  });
}
function enlaceDeFamilia(){
  return location.origin + location.pathname + "?f=" + encodeURIComponent(local.familia);
}
function abrirCompartir(){
  var estados = {
    ok: "Todo guardado. Lo que apuntéis se ve en los dos móviles.",
    enviando: "Guardando…",
    pendiente: "Queda algo por enviar; se manda solo en cuanto haya cobertura.",
    sin: "Ahora mismo sin conexión: se apunta aquí y se envía solo al recuperarla.",
    local: "Sin conectar todavía."
  };
  abrirHoja('' +
    '<h2>📲 El móvil de los dos</h2>' +
    '<p class="sub">Los dos móviles que usen este código comparten corazones, estrellas y ranking. ' + esc(estados[red] || "") + '</p>' +
    '<p class="codigo" id="codigoFamilia">' + esc(local.familia) + '</p>' +
    '<button class="grande bien" type="button" id="btnEnlace">📤 ENVIAR ENLACE AL OTRO MÓVIL</button>' +
    '<div class="campo" style="margin-top:18px"><label for="cfgFam">…o escribe aquí el código del otro móvil</label>' +
      '<input id="cfgFam" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="40" placeholder="casa-xxxxxxxx"></div>' +
    '<button class="secundario" type="button" id="btnConectar">CONECTAR CON ESE CÓDIGO</button>' +
    '<button class="secundario" type="button" data-cerrar>Cerrar</button>'
  );
  document.getElementById("btnEnlace").addEventListener("click", function(){
    var enlace = enlaceDeFamilia(), b = document.getElementById("btnEnlace");
    if (navigator.share){
      navigator.share({ title:"El Súper Reto", text:"Abre esto para apuntar tú también:", url:enlace }).catch(function(){});
      return;
    }
    var listo = function(){ b.textContent = "✅ ENLACE COPIADO"; setTimeout(function(){ b.textContent = "📤 ENVIAR ENLACE AL OTRO MÓVIL"; }, 2500); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(enlace).then(listo, function(){ document.getElementById("codigoFamilia").textContent = enlace; });
    } else {
      document.getElementById("codigoFamilia").textContent = enlace;
    }
  });
  document.getElementById("btnConectar").addEventListener("click", function(){
    var v = (document.getElementById("cfgFam").value || "").trim().toLowerCase();
    if (!/^[a-z0-9][a-z0-9-]{3,39}$/.test(v)) { document.getElementById("cfgFam").focus(); return; }
    conectarCon(v);
    cerrarHoja();
  });
}
function conectarCon(codigo){
  if (!codigo || codigo === local.familia) return;
  local.familia = codigo;
  local.doc = docVacio();
  red = "pendiente";
  guardar(); pintar(); sincronizar();
}
function abrirPremios(){
  var filas = NINAS.map(function(n){
    var pendientes = premiosDe(n.id, "ganado"), dados = premiosDe(n.id, "entregado").length;
    var lineas = pendientes.map(function(p){
      return '<div class="fotofila" style="--acento:' + n.acento + '">' +
               avatar(n) +
               '<span class="quien">' + n.nombre + '<br><small style="font-weight:600;color:var(--suave)">🎁 ganado el ' + esc(p.dia) + '</small></span>' +
               '<button class="quitar" type="button" data-entregado="' + esc(p.clave) + '" style="min-width:auto;padding:0 14px;font-weight:700">✅ Ya se lo dimos</button>' +
             '</div>';
    }).join("");
    if (!pendientes.length){
      lineas = '<div class="fotofila" style="--acento:' + n.acento + '">' + avatar(n) +
               '<span class="quien">' + n.nombre + '<br><small style="font-weight:600;color:var(--suave)">sin premios pendientes' +
               (dados ? " · " + dados + (dados > 1 ? " entregados" : " entregado") : "") + '</small></span></div>';
    }
    return lineas;
  }).join("");
  abrirHoja('' +
    '<h2>🎁 Premios ganados</h2>' +
    '<p class="sub">Cada día que llega a las estrellas del objetivo se le apunta un premio. No se pierde al empezar un día nuevo: se queda aquí hasta que se lo deis.</p>' +
    filas +
    '<button class="grande bien" type="button" data-cerrar style="margin-top:16px">LISTO</button>'
  );
}
function confirmarNuevoDia(){
  abrirHoja('' +
    '<h2>🔄 ¿Empezar un nuevo día?</h2>' +
    '<p class="sub">Las tres vuelven a tener ' + cfg().oportunidades + ' ❤️ y 0 ⭐, y se borra lo apuntado hoy en los dos móviles. Los ajustes y el ranking de la semana se mantienen.</p>' +
    '<button class="grande mal" type="button" id="siNuevoDia">SÍ, EMPEZAR DE NUEVO</button>' +
    '<button class="secundario" type="button" data-cerrar>No, seguir con el día</button>'
  );
  document.getElementById("siNuevoDia").addEventListener("click", function(){ nuevoDia(); cerrarHoja(); });
}

/* ---------------- eventos ---------------- */
document.addEventListener("click", function(e){
  var b = e.target && e.target.closest ? e.target.closest("button") : null;
  if (!b) return;
  if (b.hasAttribute("data-cerrar")) { cerrarHoja(); return; }
  var vista = b.getAttribute("data-vista");
  if (vista){ local.vista = vista; guardar(); pintarRanking(); return; }
  var ir = b.getAttribute("data-ir");
  if (ir){
    var t = document.querySelector('[data-tarjeta="' + ir + '"]');
    if (t) t.scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }
  var acc = b.getAttribute("data-accion");
  if (acc === "bien" || acc === "mal") { apuntar(b.getAttribute("data-nina"), acc); return; }
  if (acc === "deshacer") { deshacer(b.getAttribute("data-nina")); return; }
  if (b.id === "btnNuevoDia") { confirmarNuevoDia(); return; }
  if (b.id === "btnAjustes")  { abrirAjustes(); return; }
  if (b.id === "btnSync")     { abrirCompartir(); return; }
  if (b.id === "btnEscaparate"){ abrirEscaparate(); return; }
  if (b.getAttribute("data-premios")) { abrirPremios(); return; }
  var entregado = b.getAttribute("data-entregado");
  if (entregado){
    var trozos = entregado.split("|");
    ponerPremio(trozos[0], trozos[1], "entregado");
    guardar(); pintar(); pedirSync(0); abrirPremios();
    return;
  }
  var quitar = b.getAttribute("data-quitarfoto");
  if (quitar){ guardarFoto(quitar, ""); abrirFotos(); return; }
  if (b.id === "btnSonido")   {
    local.sonido = !local.sonido; guardar();
    b.textContent = local.sonido ? "🔊" : "🔇";
    if (local.sonido) sonar("bien");
    return;
  }
});

(function salidaDelEscaparate(){
  var b = document.getElementById("btnSalirEscaparate"), t = null;
  function arranca(e){
    if (e && e.cancelable) e.preventDefault();
    b.classList.add("pulsando");
    clearTimeout(t);
    t = setTimeout(function(){ b.classList.remove("pulsando"); cerrarEscaparate(); }, 900);
  }
  function suelta(){ clearTimeout(t); b.classList.remove("pulsando"); }
  b.addEventListener("pointerdown", arranca);
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){ b.addEventListener(ev, suelta); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && escaparateAbierto) cerrarEscaparate(); });
})();

var diaPintado = hoy();
function repasar(){
  if (diaPintado !== hoy()){ diaPintado = hoy(); pintar(); }   /* ha cambiado el dia */
  sincronizar();
}
document.addEventListener("visibilitychange", function(){ if (!document.hidden) repasar(); });
window.addEventListener("focus", repasar);
window.addEventListener("online", function(){ pedirSync(200); });
setInterval(function(){ if (!document.hidden) repasar(); }, 12000);

/* ---------------- arranque ---------------- */
local = cargar();
(function codigoDeLaUrl(){
  var m = (location.search + location.hash).match(/[?&#]f=([a-z0-9-]{4,40})/i);
  if (!m) return;
  var codigo = m[1].toLowerCase();
  if (codigo !== local.familia){ local.familia = codigo; local.doc = docVacio(); }
  try { history.replaceState(null, "", location.pathname); } catch(e){}
})();
guardar();
pintar();
sincronizar();

if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
window.__reto = {
  local: function(){ return local; },
  pintar: pintar,
  sincronizar: sincronizar,
  conectarCon: conectarCon,
  marcador: function(d,n){ return marcador(d,n); }
};
})();
