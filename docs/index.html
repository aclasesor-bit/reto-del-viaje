<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>El Reto del Viaje</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#fbf7f2">
<meta name="description" content="Juego de comportamiento para Valeria, Alejandra y Paula.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="El Reto">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg1:#fdf7f1; --bg2:#eef4fb;
  --tinta:#2c3244; --suave:#6b7385; --linea:#e9e3dc;
  --verde:#2e9c6b; --verde-osc:#237a53; --verde-luz:#e6f6ee;
  --rojo:#e0574f; --rojo-osc:#b9433c; --rojo-luz:#fdeceb;
  --r:22px;
  --sombra:0 6px 18px rgba(44,50,68,.08), 0 1px 3px rgba(44,50,68,.06);
}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  color:var(--tinta);
  background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  padding:0 0 env(safe-area-inset-bottom);
}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
.envoltura{max-width:640px;margin:0 auto;padding:0 14px 40px}

/* ---------- cabecera ---------- */
.top{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  background:rgba(253,247,241,.92);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--linea);
}
.top h1{
  flex:1;min-width:0;margin:0;font-size:1.2rem;line-height:1.15;font-weight:800;letter-spacing:-.02em;
}
.top h1 small{display:block;font-size:.72rem;font-weight:600;color:var(--suave);margin-top:2px}
.icono{
  width:46px;height:46px;flex:0 0 46px;border-radius:14px;border:1px solid var(--linea);
  background:#fff;font-size:1.2rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(44,50,68,.06);
}
.icono:active{transform:scale(.94)}

/* ---------- tarjeta ---------- */
.tarjeta{
  background:#fff;border-radius:var(--r);box-shadow:var(--sombra);
  padding:14px 15px 15px;margin-top:12px;border:1px solid rgba(233,227,220,.9);
  position:relative;overflow:hidden;
}
.tarjeta::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--acento)}
.tarjeta.castigada{background:#fff6f5;border-color:#f6cfcc}
.tarjeta.premiada{background:#f6fdf9;border-color:#c9ecd9}
.nombre{
  display:flex;align-items:center;gap:9px;margin:4px 0 10px;
  font-size:1.3rem;font-weight:800;letter-spacing:-.02em;
}
.inicial{
  width:42px;height:42px;flex:0 0 42px;border-radius:50%;
  background:var(--acento);color:#fff;font-size:1.05rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-size:cover;background-position:center top;
}
.inicial.confoto{box-shadow:0 0 0 2.5px var(--acento), 0 0 0 4px #fff;color:transparent}
.marcador{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
.fila{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:36px}
.pip{font-size:1.72rem;line-height:1.05;display:inline-block}
.pip.vacio{filter:grayscale(1);opacity:.24}
.cuenta{
  margin-left:auto;font-size:.85rem;font-weight:700;color:var(--suave);
  background:#f5f2ee;border-radius:999px;padding:4px 11px;white-space:nowrap;
}
@keyframes romper{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.45) rotate(-14deg)}60%{transform:scale(.7) rotate(12deg);opacity:.5}100%{transform:scale(1) rotate(0)}}
@keyframes brotar{0%{transform:scale(.2) rotate(-40deg);opacity:0}55%{transform:scale(1.45) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.pip.rompe{animation:romper .55s ease}
.pip.brota{animation:brotar .55s cubic-bezier(.22,1.2,.4,1)}
@keyframes temblar{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(6px)}45%{transform:translateX(-5px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.tarjeta.tiembla{animation:temblar .5s ease}
@keyframes saltar{0%,100%{transform:translateY(0)}35%{transform:translateY(-7px)}70%{transform:translateY(0)}}
.tarjeta.salta{animation:saltar .45s ease}

/* ---------- avisos ---------- */
@keyframes entrar{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.aviso{
  display:flex;align-items:center;gap:9px;border-radius:16px;padding:10px 12px;margin-bottom:10px;
  font-weight:800;font-size:1rem;line-height:1.25;animation:entrar .3s ease;
}
.aviso .emo{font-size:1.6rem;line-height:1}
.aviso.mal{background:var(--rojo-luz);color:var(--rojo-osc);border:1px solid #f6cfcc}
.aviso.bien{background:var(--verde-luz);color:var(--verde-osc);border:1px solid #c9ecd9}
@keyframes penar{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) translateY(2px)}75%{transform:rotate(7deg) translateY(2px)}}
.aviso.mal .emo{animation:penar 1.9s ease-in-out infinite}
@keyframes latir{0%,100%{transform:scale(1)}40%{transform:scale(1.22)}}
.aviso.bien .emo{animation:latir 1.3s ease-in-out infinite}

/* ---------- botones ---------- */
.acciones{display:flex;flex-direction:column;gap:8px}
.grande{
  width:100%;min-height:60px;border:0;border-radius:18px;
  font-size:1.05rem;font-weight:800;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:10px 12px;text-align:center;line-height:1.15;
  box-shadow:0 4px 0 var(--sombra-btn), 0 6px 14px rgba(44,50,68,.13);
  transition:transform .07s ease, box-shadow .07s ease;
}
.grande .em{font-size:1.3rem}
.grande:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sombra-btn),0 3px 8px rgba(44,50,68,.13)}
.grande[disabled]{opacity:.42;box-shadow:none;transform:none;cursor:default}
.bien{background:var(--verde);--sombra-btn:var(--verde-osc)}
.mal{background:var(--rojo);--sombra-btn:var(--rojo-osc)}
.deshacer{
  width:100%;min-height:48px;border-radius:15px;border:1.5px solid var(--linea);
  background:#faf8f6;color:var(--suave);font-size:.98rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.deshacer:active{background:#f0ece7}
.deshacer[disabled]{opacity:.4;cursor:default}

/* ---------- ranking ---------- */
.ranking{padding:13px 14px 4px}
.ranking-cab{display:flex;align-items:center;gap:8px}
.ranking h2{
  flex:1;min-width:0;margin:0;font-size:1rem;font-weight:800;letter-spacing:-.01em;
}
.sync{
  flex:0 0 auto;min-height:36px;border-radius:999px;border:1.5px solid var(--linea);
  background:#faf8f6;font-size:.76rem;font-weight:700;color:var(--suave);
  padding:6px 11px;white-space:nowrap;font-family:inherit;
}
.sync.mal{border-color:#f6cfcc;background:var(--rojo-luz);color:var(--rojo-osc)}
.sync.bien{border-color:#c9ecd9;background:var(--verde-luz);color:var(--verde-osc)}
.pestanas{display:flex;gap:6px;margin:10px 0 2px;background:#f5f2ee;border-radius:14px;padding:4px}
.pest{
  flex:1;min-height:44px;border:0;border-radius:11px;background:none;
  font-size:.95rem;font-weight:800;color:var(--suave);font-family:inherit;
}
.pest.activa{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(44,50,68,.12)}
.pista{margin:8px 2px 2px;font-size:.74rem;font-weight:600;color:var(--suave);line-height:1.35}
.rank{
  display:flex;width:100%;align-items:center;gap:10px;min-height:52px;
  padding:9px 2px;border:0;border-top:1px solid #f2eee9;background:none;
  font-family:inherit;color:inherit;text-align:left;
}
.rank:active{background:#faf7f4}
.puesto{flex:0 0 30px;font-size:1.3rem;line-height:1;text-align:center}
.puesto.igualados{font-size:1rem;color:var(--suave);font-weight:800}
.rank .quien{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:800}
.rank .punto{width:10px;height:10px;flex:0 0 10px;border-radius:50%;background:var(--acento)}
.rank .carita{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;background-size:cover;background-position:center top;
  box-shadow:0 0 0 2px var(--acento);
}
.rank .marca{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:800;white-space:nowrap}
.rank .marca span{display:inline-flex;align-items:center;gap:3px}
.rank .sello{font-size:1.1rem}
.rank.malva .marca{color:var(--rojo-osc)}
.rank.buena .marca{color:var(--verde-osc)}

/* ---------- ranking semanal ---------- */
.semanera{border-top:1px solid #f2eee9;padding:10px 2px 12px}
.semanera:first-child{border-top:0}
.semanera .rank{border-top:0;padding:0;min-height:44px}
.dias{display:flex;gap:5px;margin-top:8px}
.dia{
  flex:1;min-width:0;border-radius:12px;background:#f6f3f0;padding:6px 1px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.dia b{font-size:.68rem;font-weight:800;color:var(--suave)}
.dia i{font-style:normal;font-size:.95rem;font-weight:800;line-height:1.2}
.dia.premio{background:var(--verde-luz);color:var(--verde-osc)}
.dia.castigo{background:var(--rojo-luz);color:var(--rojo-osc)}
.dia.hoy{box-shadow:inset 0 0 0 2px var(--acento)}
.dia.futuro{opacity:.4}
.fotofila{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #f2eee9}
.fotofila:first-of-type{border-top:0}
.fotofila .inicial{width:52px;height:52px;flex:0 0 52px;font-size:1.15rem}
.fotofila .quien{flex:1;min-width:0;font-weight:800;font-size:1.02rem}
.fotofila label{
  min-height:46px;border-radius:14px;border:1.5px solid var(--linea);background:#faf8f6;
  display:flex;align-items:center;justify-content:center;padding:0 14px;
  font-weight:700;font-size:.92rem;color:var(--suave);cursor:pointer;
}
.fotofila input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.fotofila .quitar{
  min-height:46px;min-width:46px;border-radius:14px;border:1.5px solid var(--linea);
  background:#faf8f6;font-size:1rem;font-family:inherit;
}
.codigo{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.35rem;font-weight:700;
  text-align:center;background:#f5f2ee;border-radius:14px;padding:14px 10px;margin:0 0 14px;
  letter-spacing:.06em;word-break:break-all;
}

/* ---------- pie ---------- */
.bloque{
  background:#fff;border-radius:var(--r);box-shadow:var(--sombra);
  border:1px solid rgba(233,227,220,.9);margin-top:16px;overflow:hidden;
}
.bloque > summary{
  list-style:none;cursor:pointer;padding:16px;font-weight:800;font-size:1rem;
  display:flex;align-items:center;gap:9px;min-height:56px;
}
.bloque > summary::-webkit-details-marker{display:none}
.bloque > summary .flecha{margin-left:auto;color:var(--suave);font-size:.9rem;transition:transform .2s}
.bloque[open] > summary .flecha{transform:rotate(180deg)}
.historial{list-style:none;margin:0;padding:0 16px 8px;max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.historial li{
  display:flex;align-items:center;gap:9px;padding:11px 0;border-top:1px solid #f2eee9;
  font-size:.95rem;line-height:1.3;
}
.historial li .hora{color:var(--suave);font-variant-numeric:tabular-nums;font-size:.86rem;flex:0 0 auto}
.historial li .quien{font-weight:700}
.historial .vacio{color:var(--suave);padding:14px 0;border:0}
.nuevodia{
  width:100%;min-height:62px;margin-top:16px;border-radius:18px;border:1.5px solid #d9d2ca;
  background:#fff;color:var(--tinta);font-size:1.02rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:var(--sombra);
}
.nuevodia:active{transform:translateY(2px)}
.firma{text-align:center;color:var(--suave);font-size:.78rem;margin:18px 0 0;line-height:1.5}

/* ---------- panel inferior ---------- */
.velo{
  position:fixed;inset:0;z-index:60;background:rgba(30,34,46,.45);
  display:flex;align-items:flex-end;justify-content:center;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.velo[hidden]{display:none}
@keyframes subir{from{transform:translateY(100%)}to{transform:none}}
.hoja{
  width:100%;max-width:640px;background:#fff;border-radius:26px 26px 0 0;
  padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);
  max-height:92vh;overflow-y:auto;animation:subir .26s cubic-bezier(.2,.9,.3,1);
}
.hoja h2{margin:0 0 4px;font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.hoja p.sub{margin:0 0 16px;color:var(--suave);font-size:.92rem;line-height:1.45}
.campo{margin-bottom:15px}
.campo label{display:block;font-weight:700;font-size:.92rem;margin-bottom:7px}
.campo input{
  width:100%;min-height:54px;border-radius:14px;border:1.5px solid var(--linea);
  padding:12px 14px;font-size:1.05rem;font-family:inherit;color:var(--tinta);background:#fbf9f7;
}
.campo input:focus{outline:none;border-color:#b9c2d4;background:#fff}
.numeros{display:flex;gap:10px}
.numeros .campo{flex:1;min-width:0}
.hoja .grande{margin-top:6px}
.hoja .secundario{
  width:100%;min-height:56px;margin-top:10px;border-radius:16px;border:1.5px solid var(--linea);
  background:#faf8f6;font-size:1rem;font-weight:700;color:var(--suave);font-family:inherit;
}
/* ---------- logros ---------- */
.logros{display:flex;flex-wrap:wrap;gap:7px;margin:-2px 0 11px}
.logro{
  display:inline-flex;align-items:center;min-height:44px;padding:6px 14px;border-radius:999px;
  background:#f5f2ee;border:1.5px solid var(--linea);color:var(--suave);
  font-family:inherit;font-size:.86rem;font-weight:800;
}
.logro.premio{background:#fff6e6;border-color:#f3dcb0;color:#8a5a10}
.logro.premio:active{background:#fdedd0}

/* ---------- pantalla para ellas ---------- */
#escaparate{
  position:fixed;inset:0;z-index:70;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%);
  padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 96px);
}
#escaparate[hidden]{display:none}
.esc-titulo{margin:0 0 14px;text-align:center;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.esc-nina{
  background:#fff;border-radius:24px;box-shadow:var(--sombra);border:1px solid rgba(233,227,220,.9);
  padding:16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;
  border-left:7px solid var(--acento);
}
.esc-nina.castigada{background:#fff6f5;border-color:#f6cfcc}
.esc-nina.premiada{background:#f6fdf9;border-color:#c9ecd9}
.esc-foto{
  width:84px;height:84px;flex:0 0 84px;border-radius:50%;background:var(--acento);
  color:#fff;font-size:2rem;font-weight:800;display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center top;
}
.esc-foto.confoto{color:transparent;box-shadow:0 0 0 3px var(--acento),0 0 0 5px #fff}
.esc-datos{flex:1;min-width:0}
.esc-nombre{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.esc-pips{font-size:1.5rem;line-height:1.35;word-break:break-word}
.esc-pips .vacio{filter:grayscale(1);opacity:.24}
.esc-estado{margin-top:6px;font-size:1rem;font-weight:800}
.esc-estado.mal{color:var(--rojo-osc)}
.esc-estado.bien{color:var(--verde-osc)}
.esc-estado.normal{color:var(--suave);font-weight:700;font-size:.9rem}
.esc-salir{
  position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);
  max-width:612px;margin:0 auto;min-height:58px;border-radius:18px;border:1.5px solid var(--linea);
  background:#fff;color:var(--suave);font-size:1rem;font-weight:800;font-family:inherit;
  overflow:hidden;box-shadow:var(--sombra);
}
.esc-salir .relleno{position:absolute;left:0;top:0;bottom:0;width:0;background:#eee8e1}
.esc-salir.pulsando .relleno{width:100%;transition:width .9s linear}
.esc-salir .texto{position:relative}
#confeti{position:fixed;inset:0;z-index:80;pointer-events:none}
#confeti[hidden]{display:none}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
}
@media (min-width:760px){
  .envoltura{max-width:1120px;display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px;align-items:start}
  #ninas{display:contents}
  .arriba,
  .pie{grid-column:1 / -1;max-width:640px;width:100%;margin:0 auto}
}
</style>
</head>
<body>

<header class="top">
  <h1>El Reto del Viaje</h1>
  <button class="icono" id="btnEscaparate" type="button" aria-label="Enseñárselo a ellas">👀</button>
  <button class="icono" id="btnSonido" type="button" aria-label="Sonido">🔊</button>
  <button class="icono" id="btnAjustes" type="button" aria-label="Ajustes">⚙️</button>
</header>

<div class="envoltura">
  <div class="arriba">
    <section class="bloque ranking" id="ranking" aria-label="Ranking">
      <div class="ranking-cab">
        <h2 id="tituloRanking">🏆 Ranking de hoy</h2>
        <button class="sync" id="btnSync" type="button">📱</button>
      </div>
      <div class="pestanas">
        <button class="pest" type="button" data-vista="hoy">Hoy</button>
        <button class="pest" type="button" data-vista="semana">Semana L–V</button>
      </div>
      <p class="pista" id="pistaRanking"></p>
      <div id="listaRanking"></div>
    </section>

    <button class="nuevodia" id="btnNuevoDia" type="button">🔄 EMPEZAR NUEVO DÍA</button>
  </div>

  <main id="ninas"></main>

  <div class="pie">
    <details class="bloque" id="bloqueHistorial">
      <summary>📜 Historial de hoy <span class="flecha" aria-hidden="true">▼</span></summary>
      <ul class="historial" id="historial"></ul>
    </details>

    <p class="firma" id="firma"></p>
  </div>
</div>

<section id="escaparate" hidden aria-label="Pantalla para las niñas">
  <h2 class="esc-titulo">🏆 ¿Cómo vamos hoy?</h2>
  <div id="escaparateLista"></div>
  <button class="esc-salir" id="btnSalirEscaparate" type="button"><span class="relleno"></span><span class="texto">Mantén pulsado para salir</span></button>
</section>

<canvas id="confeti" hidden></canvas>

<div class="velo" id="velo" hidden>
  <div class="hoja" id="hoja"></div>
</div>

<script>
(function(){
"use strict";

var API = "https://miplandeempresa.com/reto-api";
var CLAVE = "reto-del-viaje-v2";
var CLAVE_VIEJA = "reto-del-viaje-v1";
var NINAS = [
  { id:"valeria",   nombre:"Valeria",   acento:"#e46a8b" },
  { id:"alejandra", nombre:"Alejandra", acento:"#7b6cd9" },
  { id:"paula",     nombre:"Paula",     acento:"#2aa8a8" }
];
var POR_DEFECTO = {
  oportunidades: 5,
  objetivo: 5,
  textoRecompensa: "¡Premio especial!",
  textoCastigo: "Castigada",
  ts: 0
};
var LETRAS = ["L","M","X","J","V"];

/* local = lo que guarda este movil:
     familia  codigo compartido con el otro movil
     doc      copia de lo que hay en el servidor (eventos por dia)
     cola     lo apuntado aqui que aun no ha llegado al servidor          */
var local = null;
var sincronizando = false, otraVuelta = false, red = "local", temporizador = null;

/* ---------------- utilidades ---------------- */
function dosCifras(n){ return String(n).padStart(2,"0"); }
function claveFecha(d){ return d.getFullYear() + "-" + dosCifras(d.getMonth()+1) + "-" + dosCifras(d.getDate()); }
function hoy(){ return claveFecha(new Date()); }
function ahora(){ var d = new Date(); return dosCifras(d.getHours()) + ":" + dosCifras(d.getMinutes()); }
function limitar(v, min, max, porDefecto){
  if (typeof v !== "number" || isNaN(v)) v = (porDefecto === undefined ? min : porDefecto);
  return Math.max(min, Math.min(max, v));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nuevoCodigo(){
  var a = "abcdefghijkmnpqrstuvwxyz23456789", s = "";
  for (var i=0;i<8;i++) s += a.charAt(Math.floor(Math.random()*a.length));
  return "casa-" + s;
}
function esc(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
/* lunes de la semana en la que cae d */
function lunesDe(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function semanaLaboral(){
  var l = lunesDe(new Date()), dias = [];
  for (var i=0;i<5;i++){ var x = new Date(l.getFullYear(), l.getMonth(), l.getDate()+i); dias.push(claveFecha(x)); }
  return dias;
}

/* ---------------- estado ---------------- */
function docVacio(){ return { v:1, config:null, fotos:{}, premios:{}, dias:{}, ts:0 }; }
function localVacio(){
  return { familia:null, sonido:true, vista:"hoy", doc:docVacio(), cola:{ nuevos:[], borrados:[], config:null, fotos:null, premios:null } };
}
function cfg(){
  var c = local.doc.config || {};
  return {
    oportunidades: limitar(parseInt(c.oportunidades,10), 1, 10, POR_DEFECTO.oportunidades),
    objetivo:      limitar(parseInt(c.objetivo,10),      1, 10, POR_DEFECTO.objetivo),
    textoRecompensa: c.textoRecompensa || POR_DEFECTO.textoRecompensa,
    textoCastigo:    c.textoCastigo    || POR_DEFECTO.textoCastigo,
    ts: Number(c.ts) || 0
  };
}
var RE_FOTO = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
function fotoDe(ninaId){
  var f = (local.doc.fotos || {})[ninaId];
  var img = f && typeof f.img === "string" ? f.img : "";
  return RE_FOTO.test(img) ? img : "";
}
function avatar(n, clase){
  var img = fotoDe(n.id);
  return '<span class="' + (clase || "inicial") + (img ? " confoto" : "") + '"' +
         (img ? ' style="background-image:url(' + img + ')"' : '') + '>' + n.nombre.charAt(0) + '</span>';
}
function guardarFoto(ninaId, img){
  local.doc.fotos = local.doc.fotos || {};
  var reg = { img: img || "", ts: Date.now() };
  local.doc.fotos[ninaId] = reg;
  local.cola.fotos = local.cola.fotos || {};
  local.cola.fotos[ninaId] = reg;
  red = "pendiente";
  guardar(); pintar(); pedirSync(0);
}
/* recorta al centro y deja una miniatura cuadrada pequena, que viaja por la red */
function miniatura(fichero, hecho){
  var lector = new FileReader();
  lector.onload = function(){
    var im = new Image();
    im.onload = function(){
      var lado = Math.min(im.width, im.height), L = 224;
      var c = document.createElement("canvas");
      c.width = L; c.height = L;
      var g = c.getContext("2d");
      g.drawImage(im, (im.width - lado) / 2, (im.height - lado) / 2 * 0.55, lado, lado, 0, 0, L, L);
      hecho(c.toDataURL("image/jpeg", 0.82));
    };
    im.onerror = function(){ hecho(null); };
    im.src = lector.result;
  };
  lector.onerror = function(){ hecho(null); };
  lector.readAsDataURL(fichero);
}
function clavePremio(nina, d){ return nina + "|" + d; }
function estadoPremio(nina, d){
  var p = (local.doc.premios || {})[clavePremio(nina, d)];
  return (p && p.estado) || "";
}
function ponerPremio(nina, d, estado){
  var reg = { estado: estado, ts: Date.now() };
  local.doc.premios = local.doc.premios || {};
  local.doc.premios[clavePremio(nina, d)] = reg;
  local.cola.premios = local.cola.premios || {};
  local.cola.premios[clavePremio(nina, d)] = reg;
  red = "pendiente";
}
/* el premio de hoy se apunta solo en cuanto llega al objetivo, y se cae si se deshace;
   los de dias anteriores no se tocan: ya estan ganados */
function reconciliarPremios(){
  var c = cfg(), d = hoy(), cambio = false;
  NINAS.forEach(function(n){
    var m = marcador(d, n.id, c), e = estadoPremio(n.id, d);
    if (m.premiada && e !== "ganado" && e !== "entregado"){ ponerPremio(n.id, d, "ganado"); cambio = true; }
    else if (!m.premiada && e === "ganado" && tieneEventos(d, n.id)){
      /* se cae solo si ha sido un deshacer; si se ha vaciado el dia entero, el premio se queda */
      ponerPremio(n.id, d, "anulado"); cambio = true;
    }
  });
  if (cambio){ guardar(); pedirSync(); }
  return cambio;
}
function tieneEventos(d, nina){
  return eventosDe(d).some(function(e){ return e.nina === nina; });
}
function premiosDe(nina, estado){
  var p = local.doc.premios || {}, salida = [];
  Object.keys(p).forEach(function(k){
    var trozos = k.split("|");
    if (trozos[0] !== nina) return;
    if (p[k].estado !== estado) return;
    salida.push({ clave:k, dia:trozos[1] });
  });
  return salida.sort(function(a,b){ return a.dia < b.dia ? 1 : -1; });
}
/* dias seguidos, de los que se ha jugado, sin quedarse sin corazones */
function racha(nina){
  var c = cfg(), d = hoy();
  var dias = Object.keys(local.doc.dias).filter(function(f){ return f <= d && eventosDe(f).length > 0; }).sort();
  var n = 0;
  for (var i = dias.length - 1; i >= 0; i--){
    if (marcador(dias[i], nina, c).castigada) break;
    n++;
  }
  return n;
}
function dia(d, crear){
  var x = local.doc.dias[d];
  if (!x && crear) x = local.doc.dias[d] = { eventos:[], borrados:[] };
  return x || { eventos:[], borrados:[] };
}
function eventosDe(d){ return dia(d).eventos; }
/* corazones y estrellas de una nina en un dia, calculados desde los eventos */
function marcador(d, ninaId, c){
  c = c || cfg();
  var bien = 0, mal = 0;
  eventosDe(d).forEach(function(e){
    if (e.nina !== ninaId) return;
    if (e.tipo === "bien") bien++; else mal++;
  });
  return {
    estrellas: bien,
    perdidos: mal,
    corazones: Math.max(0, c.oportunidades - mal),
    castigada: c.oportunidades - mal <= 0,
    premiada: bien >= c.objetivo
  };
}
function migrarDeLaVersionVieja(){
  var v = null;
  try { v = JSON.parse(localStorage.getItem(CLAVE_VIEJA) || "null"); } catch(e){ return null; }
  if (!v || typeof v !== "object") return null;
  var g = localVacio();
  var fecha = /^\d{4}-\d{2}-\d{2}$/.test(v.fecha || "") ? v.fecha : hoy();
  g.sonido = v.sonido !== false;
  var c = v.config || {};
  g.doc.config = {
    oportunidades: limitar(parseInt(c.oportunidades,10),1,10,POR_DEFECTO.oportunidades),
    objetivo:      limitar(parseInt(c.objetivo,10),1,10,POR_DEFECTO.objetivo),
    textoRecompensa: c.textoRecompensa || POR_DEFECTO.textoRecompensa,
    textoCastigo:    c.textoCastigo || POR_DEFECTO.textoCastigo,
    ts: Date.now()
  };
  g.cola.config = g.doc.config;
  var base = Date.now() - 1000;
  (Array.isArray(v.historial) ? v.historial : []).forEach(function(h,i){
    if (!h || (h.tipo !== "bien" && h.tipo !== "mal")) return;
    var ev = { id:uid(), dia:fecha, nina:h.nina, tipo:h.tipo, hora:h.hora || ahora(), ts: base + i };
    g.doc.dias[fecha] = g.doc.dias[fecha] || { eventos:[], borrados:[] };
    g.doc.dias[fecha].eventos.push({ id:ev.id, nina:ev.nina, tipo:ev.tipo, hora:ev.hora, ts:ev.ts });
    g.cola.nuevos.push(ev);
  });
  return g;
}
function cargar(){
  var g = null;
  try { g = JSON.parse(localStorage.getItem(CLAVE) || "null"); } catch(e){ g = null; }
  if (!g || typeof g !== "object") g = migrarDeLaVersionVieja();
  if (!g || typeof g !== "object") g = localVacio();
  var base = localVacio();
  g.doc = (g.doc && typeof g.doc === "object" && g.doc.dias) ? g.doc : base.doc;
  g.doc.fotos = (g.doc.fotos && typeof g.doc.fotos === "object") ? g.doc.fotos : {};
  g.doc.premios = (g.doc.premios && typeof g.doc.premios === "object") ? g.doc.premios : {};
  g.cola = (g.cola && typeof g.cola === "object") ? g.cola : base.cola;
  g.cola.nuevos = Array.isArray(g.cola.nuevos) ? g.cola.nuevos : [];
  g.cola.borrados = Array.isArray(g.cola.borrados) ? g.cola.borrados : [];
  g.sonido = g.sonido !== false;
  g.vista = g.vista === "semana" ? "semana" : "hoy";
  if (!g.familia) g.familia = nuevoCodigo();
  return g;
}
function guardar(){
  try { localStorage.setItem(CLAVE, JSON.stringify(local)); } catch(e){}
}

/* ---------------- sincronizacion ---------------- */
function pedirSync(retraso){
  clearTimeout(temporizador);
  temporizador = setTimeout(sincronizar, retraso === undefined ? 700 : retraso);
}
function hayPendiente(){
  var c = local.cola;
  return !!(c.nuevos.length || c.borrados.length || c.config || c.fotos || c.premios);
}
function aplicarCola(){
  local.cola.borrados.forEach(function(b){
    var d = dia(b.dia, true);
    if (d.borrados.indexOf(b.id) < 0) d.borrados.push(b.id);
    d.eventos = d.eventos.filter(function(x){ return x.id !== b.id; });
  });
  local.cola.nuevos.forEach(function(ev){
    var d = dia(ev.dia, true);
    if (d.borrados.indexOf(ev.id) >= 0) return;
    if (d.eventos.some(function(x){ return x.id === ev.id; })) return;
    d.eventos.push({ id:ev.id, nina:ev.nina, tipo:ev.tipo, hora:ev.hora, ts:ev.ts });
  });
  if (local.cola.config) local.doc.config = local.cola.config;
  if (local.cola.fotos){
    local.doc.fotos = local.doc.fotos || {};
    Object.keys(local.cola.fotos).forEach(function(k){ local.doc.fotos[k] = local.cola.fotos[k]; });
  }
  if (local.cola.premios){
    local.doc.premios = local.doc.premios || {};
    Object.keys(local.cola.premios).forEach(function(k){ local.doc.premios[k] = local.cola.premios[k]; });
  }
}
function sincronizar(){
  if (!local.familia || !window.fetch) return;
  if (sincronizando){ otraVuelta = true; return; }   /* que no se pierda lo apuntado mientras se enviaba lo anterior */
  var c = local.cola;
  var nN = c.nuevos.length, nB = c.borrados.length, conf = c.config, fotos = c.fotos, premios = c.premios;
  var manda = nN || nB || conf || fotos || premios;
  sincronizando = true;
  if (manda) { red = "enviando"; pintarSync(); }
  var url = API + "/f/" + encodeURIComponent(local.familia);
  var peticion = manda
    ? fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nuevos: c.nuevos.slice(0, nN), borrados: c.borrados.slice(0, nB), config: conf || undefined, fotos: fotos || undefined, premios: premios || undefined })
      })
    : fetch(url, { cache: "no-store" });

  peticion
    .then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function(doc){
      if (!doc || typeof doc !== "object" || !doc.dias) throw new Error("respuesta rara");
      c.nuevos.splice(0, nN);
      c.borrados.splice(0, nB);
      if (conf && c.config === conf) c.config = null;
      if (fotos && c.fotos === fotos) c.fotos = null;
      if (premios && c.premios === premios) c.premios = null;
      local.doc = doc;
      aplicarCola();
      red = hayPendiente() ? "pendiente" : "ok";
      guardar();
      pintar();
      if (red === "pendiente") pedirSync(500);
    })
    .catch(function(){ red = "sin"; pintarSync(); })
    .then(function(){
      sincronizando = false;
      pintarSync();
      if (otraVuelta){ otraVuelta = false; pedirSync(200); }
    });
}
function pintarSync(){
  var b = document.getElementById("btnSync");
  var textos = {
    ok:        ["☁️ Al día", ""],
    enviando:  ["⏳ Guardando…", ""],
    pendiente: ["⏳ Pendiente", ""],
    sin:       ["⚠️ Sin conexión", "mal"],
    local:     ["📱 Solo aquí", ""]
  };
  var t = textos[red] || textos.local;
  b.textContent = t[0];
  b.className = "sync " + (t[1] || (red === "ok" ? "bien" : ""));
}

/* ---------------- sonido ---------------- */
var ctxAudio = null;
function audio(){
  if (!local.sonido) return null;
  try {
    if (!ctxAudio){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctxAudio = new AC();
    }
    if (ctxAudio.state === "suspended") ctxAudio.resume();
    return ctxAudio;
  } catch(err){ return null; }
}
function nota(ctx, hz, inicio, dur, vol, tipo){
  try {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo || "sine";
    o.frequency.setValueAtTime(hz, ctx.currentTime + inicio);
    g.gain.setValueAtTime(0.0001, ctx.currentTime + inicio);
    g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + inicio + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + inicio + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime + inicio);
    o.stop(ctx.currentTime + inicio + dur + 0.03);
  } catch(err){}
}
function sonar(cual){
  var ctx = audio(); if (!ctx) return;
  if (cual === "bien"){ nota(ctx, 660, 0, .13, .18); nota(ctx, 880, .1, .18, .16); }
  else if (cual === "mal"){ nota(ctx, 300, 0, .16, .16, "triangle"); nota(ctx, 180, .13, .26, .15, "triangle"); }
  else if (cual === "premio"){ [523,659,784,1046,1318].forEach(function(f,i){ nota(ctx, f, i*.09, .3, .16, "triangle"); }); }
  else if (cual === "castigo"){ [392,349,294,220].forEach(function(f,i){ nota(ctx, f, i*.14, .34, .16, "sawtooth"); }); }
  else if (cual === "deshacer"){ nota(ctx, 520, 0, .1, .1); }
}

/* ---------------- confeti ---------------- */
var lienzo = document.getElementById("confeti"), cctx = null, trozos = [], animando = false, tempConfeti = null;
function confeti(){
  if (!lienzo.getContext) return;
  cctx = cctx || lienzo.getContext("2d");
  lienzo.hidden = false;
  var r = window.devicePixelRatio || 1;
  lienzo.width = window.innerWidth * r; lienzo.height = window.innerHeight * r;
  lienzo.style.width = window.innerWidth + "px"; lienzo.style.height = window.innerHeight + "px";
  cctx.setTransform(r,0,0,r,0,0);
  var colores = ["#e46a8b","#7b6cd9","#2aa8a8","#f0a92c","#2e9c6b","#e0574f"];
  for (var i=0;i<140;i++){
    trozos.push({
      x: Math.random()*window.innerWidth,
      y: -20 - Math.random()*window.innerHeight*0.5,
      an: 6 + Math.random()*7, al: 9 + Math.random()*10,
      vy: 2.2 + Math.random()*3.4, vx: -1.4 + Math.random()*2.8,
      giro: Math.random()*Math.PI, vgiro: -0.16 + Math.random()*0.32,
      color: colores[i % colores.length]
    });
  }
  if (!animando){ animando = true; requestAnimationFrame(pintarConfeti); }
  clearTimeout(tempConfeti);
  tempConfeti = setTimeout(function(){ trozos = []; }, 3400);
}
function pintarConfeti(){
  cctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  for (var i=trozos.length-1;i>=0;i--){
    var p = trozos[i];
    p.x += p.vx; p.y += p.vy; p.giro += p.vgiro; p.vy += 0.02;
    if (p.y > window.innerHeight + 30){ trozos.splice(i,1); continue; }
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.giro);
    cctx.fillStyle = p.color; cctx.fillRect(-p.an/2, -p.al/2, p.an, p.al);
    cctx.restore();
  }
  if (trozos.length){ requestAnimationFrame(pintarConfeti); }
  else { animando = false; lienzo.hidden = true; }
}

/* ---------------- pintado ---------------- */
var cont = document.getElementById("ninas");
var efectos = {};

function pintar(){
  reconciliarPremios();
  var c = cfg(), d = hoy();
  cont.innerHTML = NINAS.map(function(n){
    var m = marcador(d, n.id, c);
    var fx = efectos[n.id];
    var corazones = "", estrellas = "", i;
    for (i=0;i<c.oportunidades;i++){
      var vivo = i < m.corazones;
      var animar = fx && fx.tipo === "pierde" && i === m.corazones;
      corazones += '<span class="pip' + (vivo ? "" : " vacio") + (animar ? " rompe" : "") + '">' + (vivo ? "❤️" : "🖤") + '</span>';
    }
    var tope = Math.max(c.objetivo, m.estrellas);
    for (i=0;i<tope;i++){
      var llena = i < m.estrellas;
      var brota = fx && fx.tipo === "gana" && i === m.estrellas - 1;
      estrellas += '<span class="pip' + (llena ? "" : " vacio") + (brota ? " brota" : "") + '">⭐</span>';
    }
    var aviso = "";
    if (m.castigada) {
      aviso = '<div class="aviso mal" data-castigada><span class="emo">😢</span><span>⛔ ' + esc(c.textoCastigo).toUpperCase() + '</span></div>';
    } else if (m.premiada) {
      aviso = '<div class="aviso bien" data-premiada><span class="emo">🎁</span><span>¡HAS CONSEGUIDO UNA RECOMPENSA! ' + esc(c.textoRecompensa) + '</span></div>';
    }
    var puedeDeshacer = !!ultimoEvento(d, n.id);
    var clases = "tarjeta" + (m.castigada ? " castigada" : "") + (m.premiada ? " premiada" : "");
    if (fx && fx.tipo === "pierde") clases += " tiembla";
    if (fx && fx.tipo === "gana")   clases += " salta";

    return '' +
    '<section class="' + clases + '" style="--acento:' + n.acento + '" data-tarjeta="' + n.id + '">' +
      '<h2 class="nombre">' + avatar(n) + n.nombre + '</h2>' +
      '<div class="marcador">' +
        '<div class="fila" data-corazones>' + corazones + '<span class="cuenta" data-cuenta-corazones>' + m.corazones + ' / ' + c.oportunidades + '</span></div>' +
        '<div class="fila" data-estrellas>' + estrellas + '<span class="cuenta" data-cuenta-estrellas>' + m.estrellas + ' / ' + c.objetivo + '</span></div>' +
      '</div>' +
      aviso + logros(n) +
      '<div class="acciones">' +
        '<button class="grande bien" type="button" data-accion="bien" data-nina="' + n.id + '"><span class="em">🟢</span> SE HA PORTADO BIEN</button>' +
        '<button class="grande mal" type="button" data-accion="mal" data-nina="' + n.id + '"' + (m.castigada ? " disabled" : "") + '><span class="em">🔴</span> SE HA PORTADO MAL</button>' +
        '<button class="deshacer" type="button" data-accion="deshacer" data-nina="' + n.id + '"' + (puedeDeshacer ? "" : " disabled") + '>↩️ Deshacer última acción</button>' +
      '</div>' +
    '</section>';
  }).join("");
  efectos = {};
  pintarRanking();
  pintarHistorial();
  pintarEscaparate();
  pintarSync();
  document.getElementById("btnSonido").textContent = local.sonido ? "🔊" : "🔇";
  document.getElementById("firma").textContent = "Día " + d + " · se guarda en los dos móviles";
}

/* ranking: primero las estrellas y, si empatan, quien conserva mas corazones */
function pintarRanking(){
  var semana = local.vista === "semana";
  document.getElementById("tituloRanking").textContent = semana ? "🏆 Ranking de la semana" : "🏆 Ranking de hoy";
  document.getElementById("pistaRanking").textContent = semana

    : "Gana quien más ⭐ lleva hoy · desempata el ❤️";
  Array.prototype.forEach.call(document.querySelectorAll(".pest"), function(p){
    p.className = "pest" + (p.getAttribute("data-vista") === local.vista ? " activa" : "");
  });
  document.getElementById("listaRanking").innerHTML = semana ? htmlSemana() : htmlHoy();
}
function ordenar(lista){
  lista.sort(function(a,b){
    if (b.estrellas !== a.estrellas) return b.estrellas - a.estrellas;
    return a.perdidos - b.perdidos;
  });
  var empate = lista.every(function(x){ return x.estrellas === lista[0].estrellas && x.perdidos === lista[0].perdidos; });
  var puesto = 0, antEstrellas = null, antPerdidos = null;
  lista.forEach(function(x,i){
    if (x.estrellas !== antEstrellas || x.perdidos !== antPerdidos){ puesto = i+1; antEstrellas = x.estrellas; antPerdidos = x.perdidos; }
    x.puesto = puesto;
    x.empate = empate;
  });
  return lista;
}
function medalla(x){
  if (x.empate) return '<span class="puesto igualados">–</span>';
  var m = { 1:"🥇", 2:"🥈", 3:"🥉" }[x.puesto] || (x.puesto + "º");
  return '<span class="puesto">' + m + '</span>';
}
function htmlHoy(){

function htmlSemana(){
  var c = cfg(), dias = semanaLaboral(), d = hoy();
  var lista = ordenar(NINAS.map(function(n){
    var total = { nina:n, estrellas:0, perdidos:0, premios:0, castigos:0, dias:[] };
    dias.forEach(function(f,i){
      var m = marcador(f, n.id, c);
      total.estrellas += m.estrellas;
      total.perdidos  += m.perdidos;
      if (m.premiada) total.premios++;
      if (m.castigada) total.castigos++;
      total.dias.push({ fecha:f, letra:LETRAS[i], m:m, hay: eventosDe(f).length > 0 });
    });
    return total;
  }));
  return lista.map(function(x){
    var chips = x.dias.map(function(z){
      var clase = "dia";
      if (z.fecha === d) clase += " hoy";
      if (z.fecha > d) clase += " futuro";
      var valor;
      if (z.fecha > d) valor = "·";
      else if (z.m.castigada){ clase += " castigo"; valor = "⛔"; }
      else if (z.m.premiada){ clase += " premio"; valor = "🎁"; }
      else valor = String(z.m.estrellas);
      return '<span class="' + clase + '"><b>' + z.letra + '</b><i>' + valor + '</i></span>';
    }).join("");
    var sellos = (x.premios ? '<span class="sello">🎁' + (x.premios > 1 ? "×" + x.premios : "") + '</span>' : '') +
                 (x.castigos ? '<span class="sello">⛔' + (x.castigos > 1 ? "×" + x.castigos : "") + '</span>' : '');
    return '<div class="semanera" style="--acento:' + x.nina.acento + '">' +
             '<button class="rank" type="button" data-ir="' + x.nina.id + '">' +
               medalla(x) +
               '<span class="quien">' + (fotoDe(x.nina.id) ? avatar(x.nina, "carita") : '<span class="punto"></span>') + x.nina.nombre + sellos + '</span>' +
               '<span class="marca"><span>⭐ ' + x.estrellas + '</span><span>💔 ' + x.perdidos + '</span></span>' +
             '</button>' +
             '<div class="dias">' + chips + '</div>' +
           '</div>';
  }).join("");
}
/* tira pequena con los premios que le quedan por canjear y la racha */
function logros(n){
  var pendientes = premiosDe(n.id, "ganado").length, dias = racha(n.id), trozos = [];
  if (pendientes) trozos.push('<button class="logro premio" type="button" data-premios="' + n.id + '">🎁 ' + pendientes + (pendientes > 1 ? " premios" : " premio") + ' por dar</button>');

var escaparateAbierto = false;
function abrirEscaparate(){ escaparateAbierto = true; document.getElementById("escaparate").hidden = false; document.body.style.overflow = "hidden"; pintarEscaparate(); }
function cerrarEscaparate(){ escaparateAbierto = false; document.getElementById("escaparate").hidden = true; document.body.style.overflow = ""; }
function pintarEscaparate(){
  if (!escaparateAbierto) return;
  var c = cfg(), d = hoy();
  document.getElementById("escaparateLista").innerHTML = NINAS.map(function(n){
    var m = marcador(d, n.id, c), i, pips = "", estrellas = "";
    for (i=0;i<c.oportunidades;i++) pips += '<span class="' + (i < m.corazones ? "" : "vacio") + '">' + (i < m.corazones ? "❤️" : "🖤") + '</span>';
    for (i=0;i<Math.max(c.objetivo, m.estrellas);i++) estrellas += '<span class="' + (i < m.estrellas ? "" : "vacio") + '">⭐</span>';
    var pendientes = premiosDe(n.id, "ganado").length, dias = racha(n.id), estado;
    if (m.castigada) estado = '<div class="esc-estado mal">⛔ ' + esc(c.textoCastigo).toUpperCase() + '</div>';
    else if (m.premiada) estado = '<div class="esc-estado bien">🎁 ¡PREMIO! ' + esc(c.textoRecompensa) + '</div>';
    else {
      var trozos = [];
      if (pendientes) trozos.push("🎁 " + pendientes + (pendientes > 1 ? " premios" : " premio"));
      if (dias >= 2) trozos.push("🔥 " + dias + " días sin castigo");
      trozos.push("te faltan " + Math.max(0, c.objetivo - m.estrellas) + " ⭐");
      estado = '<div class="esc-estado normal">' + trozos.join(" · ") + '</div>';
    }
    var foto = fotoDe(n.id);
    return '<div class="esc-nina' + (m.castigada ? " castigada" : m.premiada ? " premiada" : "") + '" style="--acento:' + n.acento + '">' +

}
function pintarHistorial(){
  var ul = document.getElementById("historial");
  var evs = eventosDe(hoy()).slice().sort(function(a,b){ return (a.ts||0) - (b.ts||0); });
  if (!evs.length){
    ul.innerHTML = '<li class="vacio">Todavía no hay nada apuntado hoy.</li>';
    return;
  }
  ul.innerHTML = evs.reverse().map(function(h){
    var n = NINAS.filter(function(x){ return x.id === h.nina; })[0];
    var txt = h.tipo === "bien" ? "⭐ Buena acción" : "💔 Perdió una oportunidad";
    return '<li><span class="hora">' + esc(h.hora) + '</span><span class="quien">' + esc(n ? n.nombre : h.nina) + '</span><span>' + txt + '</span></li>';
  }).join("");
}

/* ---------------- acciones ---------------- */
function ultimoEvento(d, ninaId){
  var ult = null;
  eventosDe(d).forEach(function(e){
    if (e.nina !== ninaId) return;
    if (!ult || (e.ts || 0) >= (ult.ts || 0)) ult = e;
  });
  return ult;
}
function apuntar(id, tipo){
  var c = cfg(), d = hoy(), antes = marcador(d, id, c);
  if (tipo === "mal" && antes.castigada) return;
  var ev = { id:uid(), dia:d, nina:id, tipo:tipo, hora:ahora(), ts:Date.now() };
  dia(d, true).eventos.push({ id:ev.id, nina:ev.nina, tipo:ev.tipo, hora:ev.hora, ts:ev.ts });
  local.cola.nuevos.push(ev);
  var despues = marcador(d, id, c);
  if (tipo === "mal"){
    efectos[id] = { tipo:"pierde" };
    sonar(despues.castigada ? "castigo" : "mal");
  } else {
    efectos[id] = { tipo:"gana" };
    if (!antes.premiada && despues.premiada){ sonar("premio"); confeti(); }
    else sonar("bien");
  }
  red = "pendiente";
  guardar(); pintar(); pedirSync();
}
function deshacer(id){
  var d = hoy(), ult = ultimoEvento(d, id);
  if (!ult) return;
  var x = dia(d, true);
  x.eventos = x.eventos.filter(function(e){ return e.id !== ult.id; });
  if (x.borrados.indexOf(ult.id) < 0) x.borrados.push(ult.id);
  local.cola.nuevos = local.cola.nuevos.filter(function(e){ return e.id !== ult.id; });
  local.cola.borrados.push({ dia:d, id:ult.id });
  sonar("deshacer");
  red = "pendiente";
  guardar(); pintar(); pedirSync();
}
function nuevoDia(){
  var d = hoy(), x = dia(d, true);
  x.eventos.forEach(function(e){
    if (x.borrados.indexOf(e.id) < 0) x.borrados.push(e.id);
    local.cola.borrados.push({ dia:d, id:e.id });
  });
  x.eventos = [];
  local.cola.nuevos = local.cola.nuevos.filter(function(e){ return e.dia !== d; });
  red = "pendiente";
  guardar(); pintar(); pedirSync(0);
}
function guardarConfig(nueva){
  nueva.ts = Date.now();
  local.doc.config = nueva;
  local.cola.config = nueva;
  red = "pendiente";
  guardar(); pintar(); pedirSync(0);
}

/* ---------------- eventos ---------------- */
document.addEventListener("click", function(e){
  var b = e.target && e.target.closest ? e.target.closest("button") : null;
  if (!b) return;
  if (b.hasAttribute("data-cerrar")) { cerrarHoja(); return; }
  var vista = b.getAttribute("data-vista");
  if (vista){ local.vista = vista; guardar(); pintarRanking(); return; }
  var ir = b.getAttribute("data-ir");
  if (ir){
    var t = document.querySelector('[data-tarjeta="' + ir + '"]');
    if (t) t.scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }
  var acc = b.getAttribute("data-accion");
  if (acc === "bien" || acc === "mal") { apuntar(b.getAttribute("data-nina"), acc); return; }
  if (acc === "deshacer") { deshacer(b.getAttribute("data-nina")); return; }
  if (b.id === "btnNuevoDia") { confirmarNuevoDia(); return; }
  if (b.id === "btnAjustes")  { abrirAjustes(); return; }
  if (b.id === "btnSync")     { abrirCompartir(); return; }
  if (b.id === "btnEscaparate"){ abrirEscaparate(); return; }
  if (b.getAttribute("data-premios")) { abrirPremios(); return; }
  var entregado = b.getAttribute("data-entregado");
  if (entregado){
    var trozos = entregado.split("|");
    ponerPremio(trozos[0], trozos[1], "entregado");
    guardar(); pintar(); pedirSync(0); abrirPremios();
    return;
  }
  var quitar = b.getAttribute("data-quitarfoto");
  if (quitar){ guardarFoto(quitar, ""); abrirFotos(); return; }
  if (b.id === "btnSonido")   {
    local.sonido = !local.sonido; guardar();
    b.textContent = local.sonido ? "🔊" : "🔇";
    if (local.sonido) sonar("bien");
    return;
  }
});

(function salidaDelEscaparate(){
  var b = document.getElementById("btnSalirEscaparate"), t = null;
  function arranca(e){
    if (e && e.cancelable) e.preventDefault();
    b.classList.add("pulsando");
    clearTimeout(t);
    t = setTimeout(function(){ b.classList.remove("pulsando"); cerrarEscaparate(); }, 900);
  }
  function suelta(){ clearTimeout(t); b.classList.remove("pulsando"); }
  b.addEventListener("pointerdown", arranca);
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){ b.addEventListener(ev, suelta); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && escaparateAbierto) cerrarEscaparate(); });
})();

}

  var codigo = m[1].toLowerCase();

  try { history.replaceState(null, "", location.pathname); } catch(e){}
})();

pintar();
sincronizar();

if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}

  pintar: pintar,
  sincronizar: sincronizar,

};
